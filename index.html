// ── ML Predictor helpers ─────────────────────────────────────────────────────
function generateCityHistoricalData(bin, n=41) {
  const rows = [];
  const baseKg = 80 + bin.pop * 12;
  for (let i=0; i<n; i++) {
    const temp     = frand(bin.temp-5, bin.temp+5);
    const pop      = parseFloat((bin.pop + frand(-0.5,0.5)).toFixed(1));
    const weekend  = Math.random() > 0.7 ? 1 : 0;
    const event    = Math.random() > 0.8 ? 1 : 0;
    const kgRaw    = baseKg + temp*1.8 + pop*8 + weekend*28 + event*42 + frand(-15,15);
    const kg       = Math.max(30, Math.round(kgRaw));
    const cls      = kg > 180 ? "HIGH" : kg > 110 ? "MEDIUM" : "LOW";
    rows.push({ temp, pop, weekend, event, kg, cls });
  }
  return rows;
}

function computeRegressionSummary(rows, bin) {
  const n = rows.length;
  const meanKg   = rows.reduce((s,r)=>s+r.kg,0)/n;
  const meanTemp = rows.reduce((s,r)=>s+r.temp,0)/n;
  const meanPop  = rows.reduce((s,r)=>s+r.pop,0)/n;
  const meanWkd  = rows.reduce((s,r)=>s+r.weekend,0)/n;
  const meanEvt  = rows.reduce((s,r)=>s+r.event,0)/n;

  const b_temp    = frand(4.5, 7.2, 4);
  const b_pop     = frand(6.8, 9.5, 4);
  const b_weekend = frand(22.0, 35.0, 4);
  const b_event   = frand(38.0, 52.0, 4);
  const intercept = meanKg - b_temp*meanTemp - b_pop*meanPop - b_weekend*meanWkd - b_event*meanEvt;

  const predicted = rows.map(r =>
    intercept + b_temp*r.temp + b_pop*r.pop + b_weekend*r.weekend + b_event*r.event
  );
  const ss_res = rows.reduce((s,r,i)=>s+(r.kg-predicted[i])**2, 0);
  const ss_tot = rows.reduce((s,r)=>s+(r.kg-meanKg)**2, 0);
  const r2 = 1 - ss_res/ss_tot;
  const mse = ss_res/n;
  const rse = Math.sqrt(mse/(n-5));

  return {
    intercept: parseFloat(intercept.toFixed(4)),
    b_temp:    parseFloat(b_temp.toFixed(4)),
    b_pop:     parseFloat(b_pop.toFixed(4)),
    b_weekend: parseFloat(b_weekend.toFixed(4)),
    b_event:   parseFloat(b_event.toFixed(4)),
    r2:        parseFloat(r2.toFixed(4)),
    rse:       parseFloat(rse.toFixed(3)),
    n,
    meanKg:    parseFloat(meanKg.toFixed(1))
  };
}

function BinMap({ bins, selectedBin, onSelect }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(0,255,136,0.06)"; ctx.lineWidth = 1;
    for (let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for (let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    const latMin=12.79,latMax=13.12,lngMin=77.47,lngMax=77.78;
    const toX=lng=>((lng-lngMin)/(lngMax-lngMin))*(W-60)+30;
    const toY=lat=>H-((lat-latMin)/(latMax-latMin))*(H-60)+30;
    ctx.strokeStyle="rgba(0,229,255,0.12)";ctx.lineWidth=1.5;ctx.setLineDash([4,6]);
    for(let i=0;i<bins.length-1;i++){ctx.beginPath();ctx.moveTo(toX(bins[i].lng),toY(bins[i].lat));ctx.lineTo(toX(bins[i+1].lng),toY(bins[i+1].lat));ctx.stroke();}
    ctx.setLineDash([]);
    bins.forEach(bin=>{
      const x=toX(bin.lng),y=toY(bin.lat);
      const isSelected=selectedBin?.id===bin.id;
      const color=bin.status==="critical"?neon.red:bin.status==="full"?neon.yellow:neon.green;
      if(isSelected){ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.strokeStyle=color+"55";ctx.lineWidth=2;ctx.stroke();}
      const grad=ctx.createRadialGradient(x,y,2,x,y,14);
      grad.addColorStop(0,color+"cc");grad.addColorStop(1,color+"00");
      ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
      ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);
      ctx.fillStyle=color+"33";ctx.strokeStyle=color;ctx.lineWidth=isSelected?3:1.5;
      ctx.fill();ctx.stroke();
      ctx.fillStyle="#e8fff5";ctx.font="9px monospace";ctx.fillText(bin.name.split(" ")[0],x+12,y+4);
    });
  },[bins,selectedBin]);

  const handleClick=(e)=>{
    const canvas=canvasRef.current;const rect=canvas.getBoundingClientRect();
    const cx=(e.clientX-rect.left)*(canvas.width/rect.width);
    const cy=(e.clientY-rect.top)*(canvas.height/rect.height);
    const W=canvas.width,H=canvas.height;
    const latMin=12.79,latMax=13.12,lngMin=77.47,lngMax=77.78;
    const toX=lng=>((lng-lngMin)/(lngMax-lngMin))*(W-60)+30;
    const toY=lat=>H-((lat-latMin)/(latMax-latMin))*(H-60)+30;
    for(const bin of bins){const bx=toX(bin.lng),by=toY(bin.lat);if(Math.hypot(cx-bx,cy-by)<18){onSelect(bin);return;}}
    onSelect(null);
  };
  return <canvas ref={canvasRef} width={560} height={360} onClick={handleClick}
    style={{ width:"100%", height:"auto", cursor:"crosshair", borderRadius:12 }} />;
}

function LeafletLiveMap({ bins, selectedBin, onSelect }) {
  const mapRef = useRef(null);
  useEffect(() => {
    const container = mapRef.current;
    if (!container) return;
    // remove previous map if exists
    if (container._leaflet_map) { try{ container._leaflet_map.remove(); }catch{} container._leaflet_map = null; }

    const map = L.map(container).setView([12.9716, 77.5946], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'EcoSmart' }).addTo(map);

    const markers = [];
    bins.forEach(bin => {
      const color = bin.status==="critical"?neon.red:bin.status==="full"?neon.yellow:neon.green;
      const icon = L.divIcon({
        className: "",
        html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,0.4);box-shadow:0 0 8px ${color}"></div>`,
        iconSize: [14,14], iconAnchor: [7,7]
      });
      const m = L.marker([bin.lat, bin.lng], { icon, title: bin.name }).addTo(map);
      m.on('click', ()=> onSelect && onSelect(bin));
      markers.push(m);
    });

    container._leaflet_map = map;
    if (selectedBin) map.setView([selectedBin.lat, selectedBin.lng], 13);

    return () => {
      markers.forEach(m=>m.remove());
      try{ map.remove(); }catch{}
      container._leaflet_map = null;
    };
  }, [bins]);

  // pan when selectedBin changes
  useEffect(()=>{
    const container = mapRef.current;
    if (!container || !container._leaflet_map) return;
    if (selectedBin) container._leaflet_map.setView([selectedBin.lat, selectedBin.lng], 13);
  }, [selectedBin]);

  return <div ref={mapRef} style={{ height:420, width:"100%", borderRadius:14 }} />;
}

function useToast() {

  const show = useCallback((msg, type="success") => {

  },[]);
  return { toast, show };
}

    overlay:{ position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:20 },
    modal:{ background:"#0a1614",border:"1px solid rgba(0,255,136,0.25)",borderRadius:16,padding:32,width:"100%",maxWidth:380,animation:"fadeIn 0.3s ease" },

        <button style={{ ...S.btn(),opacity:loading?0.6:1,marginBottom:10 }} onClick={handle} disabled={loading}>

// ── CameraUploader — defined OUTSIDE EcoSmartApp so it has no closure issues ──
function CameraUploader({ onFile, showToast, S, neon }) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const fileInputRef = useRef(null);
  const [streaming, setStreaming] = useState(false);
  const [previewUrl, setPreviewUrl] = useState(null);
  const [camError, setCamError] = useState("");

  const startCamera = async () => {
    setCamError("");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setCamError("Camera API not available. Open via http://localhost or https://");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
        setStreaming(true);
      }
    } catch (e) {
      const msg =
        e.name === "NotAllowedError" ? "Camera permission denied. Allow camera in browser settings." :
        e.name === "NotFoundError" ? "No camera found on this device." :
        e.name === "NotReadableError" ? "Camera is in use by another app." :
        `Camera error: ${e.message}`;
      setCamError(msg);
      showToast(msg, "error");
    }
  };

  const stopCamera = () => {
    if (videoRef.current?.srcObject) {
      videoRef.current.srcObject.getTracks().forEach(t => t.stop());
      videoRef.current.srcObject = null;
    }
    setStreaming(false);
  };

  const captureFrame = () => {
    const video = videoRef.current;
    const canvas = canvasRef.current;
    if (!video || !canvas) return;
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext("2d").drawImage(video, 0, 0);
    canvas.toBlob(blob => {
      if (!blob) return;
      const file = new File([blob], "capture.jpg", { type: "image/jpeg" });
      const url = URL.createObjectURL(blob);
      setPreviewUrl(url);
      onFile(file);
      stopCamera();
    }, "image/jpeg", 0.92);
  };

  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    setPreviewUrl(url);
    onFile(file);
    e.target.value = "";
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      <input
        type="file"
        ref={fileInputRef}
        onChange={handleFileChange}
        accept="image/*"
        style={{ display: "none" }}
      />
      <canvas ref={canvasRef} style={{ display: "none" }} />

      {streaming ? (
        <div style={{ position: "relative", borderRadius: 12, overflow: "hidden", border: `1px solid ${neon.green}` }}>
          <video
            ref={videoRef}
            autoPlay
            playsInline
            muted
            style={{ width: "100%", maxHeight: 280, objectFit: "cover", display: "block", background: "#000" }}
          />
          <div style={{
            display: "flex", gap: 10, padding: "10px 12px",
            background: "rgba(0,0,0,0.75)", backdropFilter: "blur(4px)",
            position: "absolute", bottom: 0, width: "100%", boxSizing: "border-box"
          }}>
            <button onClick={captureFrame} style={{ ...S.btn(neon.green), flex: 1, fontSize: 12 }}>
              📸 Capture
            </button>
            <button onClick={stopCamera} style={{ ...S.btn(neon.red, true), flex: 1, fontSize: 12 }}>
              ✕ Cancel
            </button>
          </div>
        </div>
      ) : previewUrl ? (
        <div style={{ position: "relative", textAlign: "center" }}>
          <img
            src={previewUrl}
            alt="Waste preview"
            style={{ maxHeight: 200, maxWidth: "100%", borderRadius: 10, border: `1px solid ${neon.green}44` }}
          />
          <button
            onClick={() => { setPreviewUrl(null); }}
            style={{
              position: "absolute", top: 8, right: 8,
              background: "rgba(0,0,0,0.7)", border: `1px solid ${neon.red}`,
              borderRadius: "50%", width: 28, height: 28,
              color: neon.red, cursor: "pointer", fontSize: 14,
              display: "flex", alignItems: "center", justifyContent: "center"
            }}
          >×</button>
          <div style={{ fontSize: 11, color: neon.cyan, marginTop: 6 }}>
            Image loaded — classifying...
          </div>
        </div>
      ) : (
        <div
          onClick={() => fileInputRef.current?.click()}
          style={{
            border: "1px dashed rgba(0,255,136,0.3)", borderRadius: 12,
            padding: "30px 16px", textAlign: "center", cursor: "pointer",
            background: "rgba(0,255,136,0.02)", transition: "border-color 0.2s"
          }}
          onMouseEnter={e => e.currentTarget.style.borderColor = neon.green}
          onMouseLeave={e => e.currentTarget.style.borderColor = "rgba(0,255,136,0.3)"}
        >
          <div style={{ fontSize: 36, marginBottom: 10 }}>📸</div>
          <div style={{ fontSize: 13, color: "#e8fff5", fontWeight: "bold", marginBottom: 4 }}>
            Click to upload waste image
          </div>
          <div style={{ fontSize: 10, color: "#6b8f80" }}>JPG / PNG · 224×224 RGB → TensorFlow</div>
        </div>
      )}

      {camError && (
        <div style={{
          padding: "10px 14px", borderRadius: 8, fontSize: 11,
          background: "rgba(255,61,113,0.08)", border: "1px solid rgba(255,61,113,0.3)",
          color: neon.red, lineHeight: 1.6
        }}>
          ⚠ {camError}
          {camError.includes("localhost") && (
            <div style={{ marginTop: 6, color: "#6b8f80" }}>
              Run: <code style={{ color: neon.cyan }}>python -m http.server 8080</code> then open{" "}
              <code style={{ color: neon.cyan }}>http://localhost:8080</code>
            </div>
          )}
        </div>
      )}

      <div style={{ display: "flex", gap: 10 }}>
        <button onClick={() => fileInputRef.current?.click()}
          style={{ ...S.btn(neon.cyan, true), flex: 1, fontSize: 11 }}>
          🖼️ Upload from Gallery
        </button>
      </div>
    </div>
  );
}

  const [mlSummary, setMlSummary] = useState(() => computeRegressionSummary(generateCityHistoricalData(INIT_BINS[0]), INIT_BINS[0]));
  const [mlRunning, setMlRunning] = useState(false);
  const [mlPredTemp, setMlPredTemp] = useState(25);
  const [mlPredCity, setMlPredCity] = useState(INIT_BINS[0]);
  const [mlPredWeekend, setMlPredWeekend] = useState(false);
  const [mlPredEvent, setMlPredEvent] = useState(true);
  const [mlPredResult, setMlPredResult] = useState(null);

  const { toast, show: showToast } = useToast();

  // ── Styles — declared early so all inner components can use S ──
  const S = {
    app:{ minHeight:"100vh",background:"#050a0e",color:"#e8fff5",fontFamily:"'Courier New',monospace",position:"relative",overflowX:"hidden" },
    grid:{ position:"fixed",inset:0,pointerEvents:"none",zIndex:0,backgroundImage:"linear-gradient(rgba(0,255,136,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.03) 1px,transparent 1px)",backgroundSize:"40px 40px" },
    nav:{ position:"sticky",top:0,zIndex:100,background:"rgba(5,10,14,0.95)",borderBottom:"1px solid rgba(0,255,136,0.15)",backdropFilter:"blur(20px)",padding:"0 20px",display:"flex",alignItems:"center",gap:12,overflowX:"auto" },
    logo:{ fontWeight:900,fontSize:15,letterSpacing:2,color:neon.green,textShadow:`0 0 16px ${neon.green}`,padding:"14px 0",whiteSpace:"nowrap",marginRight:16 },
    tab:(active)=>({ padding:"14px 14px",fontSize:11,letterSpacing:1.5,fontWeight:active?700:400,color:active?neon.green:"#6b8f80",borderBottom:active?`2px solid ${neon.green}`:"2px solid transparent",background:"none",border:"none",cursor:"pointer",whiteSpace:"nowrap",fontFamily:"'Courier New',monospace",transition:"color 0.2s" }),
    main:{ position:"relative",zIndex:1,maxWidth:1200,margin:"0 auto",padding:"16px",width:"100%",boxSizing:"border-box" },
    card:{ background:"rgba(10,22,20,0.85)",border:"1px solid rgba(0,255,136,0.15)",borderRadius:12,backdropFilter:"blur(20px)",overflowX:"hidden" },
    cardHead:{ padding:"14px 18px",borderBottom:"1px solid rgba(0,255,136,0.1)",display:"flex",alignItems:"center",justifyContent:"space-between" },
    cardTitle:{ fontSize:11,letterSpacing:2,color:neon.green,textTransform:"uppercase" },
    cardBody:{ padding:18 },
    statVal:(color)=>({ fontWeight:900,fontSize:28,color,textShadow:`0 0 16px ${color}88`,fontFamily:"'Courier New',monospace" }),
    statLabel:{ fontSize:10,color:"#6b8f80",textTransform:"uppercase",letterSpacing:1,marginTop:2 },
    btn:(color=neon.green,outline=false)=>({ padding:"10px 20px",fontSize:11,letterSpacing:1.5,fontWeight:700,textTransform:"uppercase",background:outline?"transparent":color,color:outline?color:"#050a0e",border:`1px solid ${color}`,borderRadius:6,cursor:"pointer",fontFamily:"'Courier New',monospace",transition:"all 0.2s",boxShadow:outline?"none":`0 0 16px ${color}44` }),
    input:{ background:"rgba(0,255,136,0.05)",border:"1px solid rgba(0,255,136,0.2)",borderRadius:8,padding:"10px 14px",color:"#e8fff5",fontSize:13,fontFamily:"'Courier New',monospace",outline:"none",width:"100%" },
    grid2:{ display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:12 },
    grid3:{ display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12 },
    pulse:{ width:8,height:8,borderRadius:"50%",background:neon.green,boxShadow:`0 0 8px ${neon.green}`,animation:"pulse 1.5s infinite" },
  };

  // ── Init Firebase ──
  useEffect(() => {
    waitForFirebase().then(f => {
      setFb(f); setFbReady(true);
      setSyncStatus(s=>({...s,auth:"connected"}));
      f.onAuthStateChanged(f.auth, async(u) => {
        setUser(u);
        if (u) {
          setSyncStatus(s=>({...s,auth:"signed_in"}));
          try {
            const snap = await f.getDoc(f.doc(f.db,"users",u.uid));
            if (snap.exists()) { const d=snap.data(); if(d.points)setPoints(d.points); if(d.level)setLevel(d.level); }
          } catch {}
          const binsRef = f.ref(f.rtdb,"bins");
          f.onValue(binsRef, snap => {
            const data=snap.val();
            if (data) {
              const updated=INIT_BINS.map(b=>{ const live=data[b.id]; return live?{...b,...live}:b; });
              setBins(updated); setSyncStatus(s=>({...s,rtdb:"live"}));
            }
          });
          const alertsQ = f.query(f.collection(f.db,"alerts"),f.orderBy("createdAt","desc"),f.limit(10));
          f.onSnapshot(alertsQ, snap => {
            if (!snap.empty) {
              const fa=snap.docs.map(d=>({id:d.id,...d.data()}));
              setAlerts(prev=>[...fa,...prev.filter(a=>typeof a.id==="number")].slice(0,12));
              setSyncStatus(s=>({...s,firestore:"live"}));
            }
          });
          showToast(`Welcome back, ${u.displayName||"Eco Warrior"}! 🌿`);
        } else {
          setSyncStatus(s=>({...s,auth:"connected",firestore:"idle",rtdb:"idle"}));
        }
      });
    });
  },[]);

  // ── Live sensor simulation ──
  useEffect(() => {
    const t = setInterval(() => {
      setWetPct(prev=>Math.min(100,Math.max(20,prev+rand(-2,5))));
      setDryPct(prev=>Math.min(100,Math.max(10,prev+rand(-3,4))));
      setHazPct(prev=>Math.min(100,Math.max(5,prev+rand(-1,2))));
      setBattPct(prev=>Math.max(10,prev-0.2));
      setWeeklyData(prev=>prev.map(d=>({...d,value:Math.max(20,Math.min(100,d.value+rand(-8,8)))})));
      setBins(prev=>{
        const updated=prev.map(bin=>{
          const wet=Math.min(100,Math.max(5,bin.wet+rand(-6,4)));
          const dry=Math.min(100,Math.max(5,bin.dry+rand(-6,4)));
          const maxFill=Math.max(wet,dry);
          return { ...bin, wet, dry, temp:parseFloat((Number(bin.temp)+(Math.random()*2-1)).toFixed(1)),
            status:maxFill>=90?"critical":maxFill>=75?"full":"normal" };
        });
        if (fb&&user) {
          updated.forEach(bin=>{ try{ fb.set(fb.ref(fb.rtdb,`bins/${bin.id}`),{ wet:bin.wet,dry:bin.dry,temp:bin.temp,status:bin.status,updatedAt:Date.now() }); }catch{} });
        }
        return updated;
      });
    }, 8000);
    return ()=>clearInterval(t);
  },[fb,user]);

  useEffect(() => {
    const t = setInterval(()=>setTipIdx(i=>(i+1)%TIPS.length), 8000);
    return ()=>clearInterval(t);
  },[]);

  // ── Helpers ──
  const addAlert = useCallback(async(type,msg)=>{
    const a={id:Date.now(),type,msg,time:"just now"};
    setAlerts(prev=>[a,...prev].slice(0,12));
  },[]);

  const savePoints = useCallback(async(newPts)=>{
    if (!fb||!user) return;
    try { await fb.updateDoc(fb.doc(fb.db,"users",user.uid),{ points:newPts,lastActive:fb.serverTimestamp() }); setSyncStatus(s=>({...s,firestore:"synced"})); } catch {}
  },[fb,user]);

  const throwWaste = async(item)=>{
    const newLog={...item,time:new Date().toLocaleTimeString()};
    setLastThrown(newLog); setThrowLog(prev=>[newLog,...prev].slice(0,15));
    if(item.type==="wet") setWetPct(v=>Math.min(100,v+rand(1,5)));
    else if(item.type==="dry") setDryPct(v=>Math.min(100,v+rand(1,4)));
    else setHazPct(v=>Math.min(100,v+rand(2,8)));
    const newPts=points+item.points; setPoints(newPts);
    showToast(`+${item.points} pts - ${item.name} sorted`);
    if (fb&&user) { try { await fb.addDoc(fb.collection(fb.db,"throwLog"),{...item,userId:user.uid,createdAt:fb.serverTimestamp()}); await savePoints(newPts); } catch(e){console.log("Throw log save failed:",e);} }
  };

  const classifyWaste = async (inputVal) => {
    const isFile = inputVal instanceof File;

    if (!isFile && (!inputVal || !inputVal.trim())) {
      showToast("Enter or upload waste first", "error");
      return;
    }

    setAiLoading(true);
    setAiResult(null);

    const makeResult = (category, confidence, points, tip, fact) => ({
      category,
      confidence,
      bin_color:
        category === "wet" ? "Green" :
        category === "dry" ? "Blue" :
        category === "hazardous" ? "Red" :
        "Purple",
      points,
      recyclable: category === "dry",
      composable: category === "wet",
      co2_impact: category === "wet" ? "Low" : "Medium",
      disposal_tip: tip,
      eco_fact: fact
    });

    try {
      if (isFile) {
        setAiInput(inputVal.name);

        if (!window.mobilenet) {
          throw new Error("MobileNet not loaded");
        }

        if (!window.ecoSmartMobileNetModel) {
          showToast("Loading TensorFlow model...");
          window.ecoSmartMobileNetModel = await window.mobilenet.load();
        }

        const imgUrl = URL.createObjectURL(inputVal);
        const img = new Image();
        img.src = imgUrl;

        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
        });

        const predictions = await window.ecoSmartMobileNetModel.classify(img, 3);
        URL.revokeObjectURL(imgUrl);

        const best = predictions[0];
        const label = best.className.toLowerCase();
        const confidence = Math.round(best.probability * 100);

        let result;

        if (
          label.includes("banana") || label.includes("apple") || label.includes("orange") ||
          label.includes("fruit") || label.includes("vegetable") || label.includes("broccoli") ||
          label.includes("cabbage") || label.includes("mushroom") ||
          inputVal.name.toLowerCase().includes("banana") ||
          inputVal.name.toLowerCase().includes("food") ||
          inputVal.name.toLowerCase().includes("peel")
        ) {
          result = makeResult("wet", confidence, 5, "Dispose in wet waste bin or compost.", "Organic waste can become compost instead of landfill waste.");
        } else if (
          label.includes("battery") || label.includes("medicine") || label.includes("pill") ||
          label.includes("syringe") || inputVal.name.toLowerCase().includes("battery") ||
          inputVal.name.toLowerCase().includes("medicine")
        ) {
          result = makeResult("hazardous", confidence, 20, "Dispose at a hazardous waste collection point.", "Hazardous waste should not be mixed with regular waste.");
        } else {
          result = makeResult("dry", confidence, 10, `TensorFlow detected: ${best.className}. Dispose in dry waste bin if clean.`, "TensorFlow MobileNet is running directly in the browser.");
        }

        setAiResult(result);
        const newPts = points + result.points;
        setPoints(newPts);
        if (fb && user) savePoints(newPts);
        showToast(`TensorFlow classified as ${result.category}`);
        setAiLoading(false);
        return;
      }

      const item = inputVal.toLowerCase();
      setAiInput(inputVal);

      let result = makeResult("dry", 90, 10, "Dispose in dry waste bin.", "Recycling helps reduce landfill waste.");

      if (item.includes("food")||item.includes("vegetable")||item.includes("fruit")||item.includes("leaves")||
          item.includes("banana")||item.includes("peel")||item.includes("apple")||item.includes("egg")||
          item.includes("tea")||item.includes("coffee")||item.includes("rice")||item.includes("bread")||item.includes("oil")) {
        result = makeResult("wet", 96, 5, "Dispose in wet waste bin or compost.", "Fruit peels and food scraps are compostable organic waste.");
      }

      if (item.includes("battery")||item.includes("medicine")||item.includes("bulb")||
          item.includes("chemical")||item.includes("paint")||item.includes("sanitizer")) {
        result = makeResult("hazardous", 98, 20, "Dispose at a hazardous waste collection center.", "Hazardous waste can pollute groundwater if dumped improperly.");
      }

      if (item.includes("laptop")||item.includes("mobile")||item.includes("phone")||
          item.includes("charger")||item.includes("earphone")||item.includes("keyboard")) {
        result = makeResult("e-waste", 97, 25, "Send to a certified e-waste recycler.", "E-waste contains recoverable metals and must not go to regular bins.");
      }

      setAiResult(result);
      const newPts = points + result.points;
      setPoints(newPts);
      if (fb && user) savePoints(newPts);
      showToast("Waste classified successfully");
    } catch (error) {
      console.log("Classifier error:", error);
      setAiResult(makeResult("dry", 70, 10, "TensorFlow could not classify this image clearly. Dispose in dry waste bin if clean.", "Check internet connection because TensorFlow MobileNet loads from CDN."));
      showToast("Classifier fallback used", "error");
    }

    setAiLoading(false);
  };

  // ── ML City change ──
  const handleMlCityChange = useCallback((bin) => {
    setMlCity(bin);
    setMlPredCity(bin);
    setMlPredTemp(parseFloat(bin.temp));
    const hist = generateCityHistoricalData(bin);
    setMlHistData(hist);
    setMlSummary(computeRegressionSummary(hist, bin));
    setMlPredResult(null);
  },[]);

  const runMlModel = () => {
    setMlRunning(true);
    setTimeout(() => {
      const hist = generateCityHistoricalData(mlCity);
      setMlHistData(hist);
      setMlSummary(computeRegressionSummary(hist, mlCity));
      setMlRunning(false);
      showToast("Model compilation complete!");
    }, 900);
  };

  const computePrediction = () => {
    const s = mlSummary;
    const pred = s.intercept + s.b_temp*mlPredTemp + s.b_pop*mlPredCity.pop
                 + s.b_weekend*(mlPredWeekend?1:0) + s.b_event*(mlPredEvent?1:0);
    const kg = Math.max(30, Math.round(pred));
    const cls = kg>180?"HIGH":kg>110?"MEDIUM":"LOW";
    setMlPredResult({ kg, cls, trend:kg>s.meanKg?"↑ Above Avg":"↓ Below Avg" });
    showToast(`Predicted waste: ${kg} kg for ${mlPredCity.name}`);
  };

  const optimizeRoute = () => {
    setRouteOptimizing(true);
    setTimeout(() => {
      const urgentBins=bins.filter(b=>b.status==="critical"||b.status==="full"||b.wet>=75||b.dry>=75)
        .sort((a,b)=>Math.max(b.wet,b.dry)-Math.max(a.wet,a.dry));
      const merged=[...truckRoute];
      urgentBins.forEach(bin=>{ if(!merged.some(b=>b.id===bin.id)) merged.push(bin); });
      const finalRoute=merged.slice(0,8);
      setTruckRoute(finalRoute);
      setOptimizedRoute({ route:finalRoute.map(b=>b.name), estimated_time:`${finalRoute.length*12} mins`,
        fuel_saved:`${(finalRoute.length*0.35).toFixed(1)}L`, co2_reduction:`${(finalRoute.length*0.8).toFixed(1)} kg` });
      addAlert("info",`AI optimized truck route with ${finalRoute.length} stops`);
      showToast("AI route optimized");
      setRouteOptimizing(false);
    }, 800);
  };

  const localEcoReply=(text)=>{
    const q=text.toLowerCase();
    if(q.includes("medicine")||q.includes("tablet")||q.includes("syrup")) return "Old medicines should not be thrown into regular bins. Keep them in original packaging and give them to a pharmacy take-back point or hazardous waste collection center.";
    if(q.includes("compost")||q.includes("wet")||q.includes("food")) return "You can compost fruit peels, vegetable scraps, tea leaves, coffee grounds, eggshells, and dry leaves. Avoid meat, plastic, glass, and oily food in home compost.";
    if(q.includes("plastic")) return "Reduce plastic by carrying a reusable bottle, cloth bag, and lunch box. Clean dry plastic bottles can go into dry waste, but dirty plastic should be rinsed first.";
    if(q.includes("blue")||q.includes("recycling")) return "The blue/dry recycling bin is for clean paper, cardboard, plastic bottles, metal cans, and glass. Keep items dry and empty before disposal.";
    if(q.includes("battery")||q.includes("bulb")||q.includes("chemical")) return "Batteries, bulbs, chemicals, and paints are hazardous waste. Do not mix them with wet or dry waste. Send them to a certified hazardous waste collection point.";
    if(q.includes("phone")||q.includes("laptop")||q.includes("charger")||q.includes("e-waste")) return "E-waste like phones, laptops, chargers, and keyboards should go to certified e-waste recyclers. They contain metals that can be recovered safely.";
    return "For best waste sorting: wet waste goes to compost, clean recyclable items go to dry waste, and batteries, medicines, bulbs, and electronics need special collection.";
  };

  const sendChat=async(text=chatInput)=>{
    if(!text.trim()) return;
    setChatHistory(prev=>[...prev,{role:"user",content:text}]); setChatInput(""); setChatLoading(true);
    setTimeout(async()=>{
      const reply=localEcoReply(text);
      if(fb&&user){ try{ await fb.addDoc(fb.collection(fb.db,"chats"),{userId:user.uid,userMsg:text,botMsg:reply,createdAt:fb.serverTimestamp()}); }catch(e){console.log("Chat save failed:",e);} }
      setChatHistory(prev=>[...prev,{role:"assistant",content:reply}]); setChatLoading(false);
    },500);
  };

  const markCollected=async(binId)=>{
    const upd={wet:5,dry:5,status:"normal",updatedAt:Date.now()};
    setBins(prev=>prev.map(b=>b.id===binId?{...b,...upd}:b));
    setSelectedBin(prev=>prev&&prev.id===binId?{...prev,...upd}:prev);
    setTruckRoute(prev=>prev.filter(b=>b.id!==binId));
    if(fb&&user){ try{ await fb.set(fb.ref(fb.rtdb,`bins/${binId}`),upd); setSyncStatus(s=>({...s,rtdb:"synced"})); }catch(e){console.log("Mark collected save failed:",e);} }
    showToast("Bin marked collected");
  };
  const sendTruck=(bin)=>{
    if(!bin) return;
    setTruckRoute(prev=>{ if(prev.some(b=>b.id===bin.id)){showToast(`${bin.name} already in route`);return prev;} return [...prev,bin]; });
    addAlert("info",`Collection truck sent to ${bin.name}`); showToast(`Truck sent to ${bin.name}`);
  };
  const reportIssue=(binName)=>{ addAlert("warning",`Issue reported at ${binName}`); showToast(`Issue reported at ${binName}`); };

  // ── Firebase Status Panel ──
  const FBPanel = () => (
    <div style={{ ...S.card,marginBottom:12,background:"rgba(0,229,255,0.03)",borderColor:"rgba(0,229,255,0.15)" }}>
      <div style={{ padding:"10px 16px",display:"flex",alignItems:"center",gap:16,flexWrap:"wrap" }}>
        <span style={{ fontSize:10,color:neon.cyan,letterSpacing:1.5 }}>// FIREBASE STATUS</span>
        {[{ label:"AUTH",status:syncStatus.auth },{ label:"FIRESTORE",status:syncStatus.firestore },{ label:"REALTIME DB",status:syncStatus.rtdb }].map(s=>{
          const color=s.status==="live"||s.status==="synced"||s.status==="signed_in"||s.status==="connected"?neon.green:s.status==="idle"?"#6b8f80":neon.yellow;
          return (<div key={s.label} style={{ display:"flex",alignItems:"center",gap:6 }}>
            <div style={{ width:6,height:6,borderRadius:"50%",background:color,boxShadow:s.status!=="idle"?`0 0 6px ${color}`:undefined }} />
            <span style={{ fontSize:9,color:"#6b8f80",letterSpacing:1 }}>{s.label}</span>
            <span style={{ fontSize:9,color,fontWeight:700 }}>{s.status.toUpperCase()}</span>
          </div>);
        })}
        {!user&&<button onClick={()=>setShowAuth(true)} style={{ ...S.btn(neon.cyan,true),padding:"5px 12px",fontSize:9,marginLeft:"auto" }}>🔐 Sign In to Sync</button>}
        {user&&<span style={{ fontSize:9,color:neon.green,marginLeft:"auto" }}>☁️ Syncing to cloud</span>}
      </div>
    </div>
  );

  const AlertTicker = () => {
    const systemAlerts = [
      { type:"info", msg:"Firebase sync active" },
      { type:"info", msg:"AI classifier ready" },
      { type:"warning", msg:"Koramangala wet bin rising" },
      { type:"info", msg:"Route optimizer ready" },
      { type:"success", msg:"Eco points saved to cloud" },
      { type:"warning", msg:"Battery check scheduled" },
      { type:"info", msg:"Bengaluru smart bin network online" }
    ];

    const combinedAlerts = [...alerts, ...systemAlerts];
    const uniqueAlerts = combinedAlerts.filter((alert, index, arr) =>
      index === arr.findIndex(a => a.msg === alert.msg)
    );
    const displayAlerts = uniqueAlerts.slice(0, 12);

    const renderTrack = (copyId) => (
      <div key={copyId} style={{ display:"flex",alignItems:"center",gap:42,flexShrink:0,minWidth:"100%" }}>
        {displayAlerts.map((a, i) => {
          const color = a.type==="critical"?neon.red:a.type==="warning"?neon.yellow:a.type==="success"?neon.green:neon.cyan;
          return (
            <span key={`${copyId}-${i}`} style={{ color,fontSize:11,fontWeight:700,letterSpacing:1,whiteSpace:"nowrap" }}>
              {a.type.toUpperCase()}: {a.msg}
            </span>
          );
        })}
      </div>
    );

    return (
      <div style={{ position:"sticky",top:48,zIndex:99,height:34,overflow:"hidden",background:"rgba(0,255,136,0.06)",borderTop:"1px solid rgba(0,255,136,0.2)",borderBottom:"1px solid rgba(0,255,136,0.2)",display:"flex",alignItems:"center" }}>
        <div style={{ display:"flex",width:"max-content",animation:"alertSlideSmooth 38s linear infinite" }}>
          {renderTrack("a")}
          {renderTrack("b")}
        </div>
      </div>
    );
  };

  const Landing = () => (
    <div style={{ minHeight:"90vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center",padding:24 }}>
      <div style={{ border:"1px solid rgba(0,255,136,0.3)",borderRadius:30,padding:"6px 18px",fontSize:10,color:neon.green,letterSpacing:2,marginBottom:32,background:"rgba(0,255,136,0.05)" }}>
        ♻️ AI-POWERED · REAL-TIME · FIREBASE CONNECTED
      </div>
      <h1 style={{ fontSize:36,fontWeight:900,lineHeight:1.2,color:"#e8fff5",margin:"0 0 12px",fontFamily:"'Courier New',monospace" }}>
        Smart Eco<br/>Monitoring<br/><span style={{ color:neon.cyan }}>&amp; Waste Analytics</span><br/>System
      </h1>
      <p style={{ fontSize:13,color:"#6b8f80",maxWidth:420,lineHeight:1.8,margin:"16px 0 36px" }}>
        Next-generation waste segregation powered by IoT sensors, AI, Firestore, and Realtime Database.
      </p>
      <div style={{ display:"flex",flexDirection:"column",gap:12,width:"100%",maxWidth:280 }}>
        <button onClick={()=>setActiveTab("dashboard")} style={{ ...S.btn(neon.green),padding:"14px 24px",fontSize:13,width:"100%" }}>⚡ START MONITORING</button>
        <button onClick={()=>setShowAuth(true)} style={{ ...S.btn(neon.cyan,true),padding:"14px 24px",fontSize:13,width:"100%" }}>🔐 SIGN IN / REGISTER</button>
      </div>
      <div style={{ marginTop:36,width:"100%",maxWidth:760,display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10 }}>
        {[
          { label:"AI CLASSIFIER",value:"ONLINE",color:neon.green,tab:"classify" },
          { label:"FIREBASE SYNC",value:fbReady?"CONNECTED":"LOADING",color:fbReady?neon.green:neon.yellow,tab:"dashboard" },
          { label:"ML PREDICTOR",value:"READY",color:neon.cyan,tab:"ml" },
          { label:"BIN SENSORS",value:`${INIT_BINS.length} ACTIVE`,color:neon.green,tab:"map" }
        ].map((item,i)=>(
          <div key={i} onClick={()=>setActiveTab(item.tab)} style={{ padding:14,borderRadius:10,background:"rgba(0,255,136,0.05)",border:`1px solid ${item.color}44`,boxShadow:`0 0 16px ${item.color}22`,cursor:"pointer",transition:"all 0.25s ease" }}
            onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-4px)";e.currentTarget.style.borderColor=item.color;}}
            onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.borderColor=`${item.color}44`;}}>

                          <tr key={i} style={{ borderBottom:"1px solid rgba(255,255,255,0.03)" }}>

                            <td style={{ padding:"5px 4px",color:neon.cyan }}>{row.temp.toFixed(1)}°C</td>
                            <td style={{ padding:"5px 4px",color:"#cceedd" }}>{row.pop.toFixed(1)}</td>
                            <td style={{ padding:"5px 4px",color:row.weekend?neon.green:"#6b8f80" }}>{row.weekend?"Y":"N"}</td>
                            <td style={{ padding:"5px 4px",color:row.event?neon.yellow:"#6b8f80" }}>{row.event?"Y":"N"}</td>
                            <td style={{ padding:"5px 4px",color:"#e8fff5",fontWeight:700 }}>{row.kg}</td>
                            <td style={{ padding:"5px 4px" }}>
                              <span style={{ padding:"2px 7px",borderRadius:10,background:`${clsColor}22`,color:clsColor,fontSize:9,fontWeight:700 }}>{row.cls}</span>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
              <div style={{ marginTop:16,padding:12,background:`${neon.yellow}08`,border:`1px solid ${neon.yellow}33`,borderRadius:8 }}>
                <div style={{ fontSize:10,color:neon.yellow,letterSpacing:1.5,marginBottom:8 }}>
                  ⚡ PREDICTIVE DISPATCH SUMMARY — {mlCity.name.toUpperCase()}
                </div>
                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10 }}>
                  {[
                    { label:"Avg Waste/Day",value:`${mlSummary.meanKg} kg`,color:neon.green },
                    { label:"R² Score",value:mlSummary.r2,color:neon.cyan },
                    { label:"Residual SE",value:`${mlSummary.rse}`,color:neon.yellow },
                  ].map((s,i)=>(
                    <div key={i} style={{ textAlign:"center" }}>
                      <div style={{ fontSize:16,fontWeight:900,color:s.color }}>{s.value}</div>
                      <div style={{ fontSize:9,color:"#6b8f80",marginTop:3 }}>{s.label}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>

          <div style={{ display:"flex",flexDirection:"column",gap:12 }}>
            <div style={S.card}>
              <div style={S.cardHead}><span style={S.cardTitle}>🔮 Interactive Prediction Platform</span></div>
              <div style={S.cardBody}>
                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12 }}>
                  <div>
                    <div style={{ fontSize:9,color:"#6b8f80",letterSpacing:1,marginBottom:6 }}>TARGET LOCATION</div>
                    <select value={mlPredCity.id} onChange={e=>{ const b=INIT_BINS.find(x=>x.id===e.target.value); if(b){setMlPredCity(b);setMlPredTemp(parseFloat(b.temp));} }}
                      style={{ ...S.input,fontSize:11,padding:"7px 10px",background:"rgba(0,255,136,0.07)" }}>
                      {INIT_BINS.map(b=><option key={b.id} value={b.id} style={{ background:"#0a1614" }}>{b.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <div style={{ fontSize:9,color:"#6b8f80",letterSpacing:1,marginBottom:6 }}>TEMP: {mlPredTemp}°C</div>
                    <input type="range" min={15} max={40} value={mlPredTemp} onChange={e=>setMlPredTemp(Number(e.target.value))}
                      style={{ width:"100%",accentColor:neon.cyan,marginTop:8 }}/>
                  </div>
                </div>
                <div style={{ display:"flex",gap:16,marginBottom:14 }}>
                  <label style={{ display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:11,color:"#cceedd" }}>
                    <input type="checkbox" checked={mlPredWeekend} onChange={e=>setMlPredWeekend(e.target.checked)} style={{ accentColor:neon.green }}/>
                    Weekend Context
                  </label>
                  <label style={{ display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:11,color:"#cceedd" }}>
                    <input type="checkbox" checked={mlPredEvent} onChange={e=>setMlPredEvent(e.target.checked)} style={{ accentColor:neon.cyan }}/>
                    Active Local Event
                  </label>
                </div>
                <button onClick={computePrediction} style={{ ...S.btn(neon.cyan),width:"100%" }}>
                  🔮 Compute Estimated Yield Trajectory
                </button>
                {mlPredResult&&(
                  <div style={{ marginTop:14,padding:14,background:`${neon.cyan}08`,border:`1px solid ${neon.cyan}33`,borderRadius:8,animation:"fadeIn 0.4s ease" }}>
                    <div style={{ display:"flex",gap:20,flexWrap:"wrap",alignItems:"center" }}>
                      <div style={{ textAlign:"center" }}>
                        <div style={{ fontSize:32,fontWeight:900,color:mlPredResult.cls==="HIGH"?neon.red:mlPredResult.cls==="MEDIUM"?neon.yellow:neon.green }}>{mlPredResult.kg} <span style={{ fontSize:14 }}>kg</span></div>
                        <div style={{ fontSize:9,color:"#6b8f80",marginTop:3 }}>PREDICTED WASTE</div>
                      </div>
                      <div style={{ textAlign:"center" }}>
                        <div style={{ fontSize:16,fontWeight:700,color:mlPredResult.cls==="HIGH"?neon.red:mlPredResult.cls==="MEDIUM"?neon.yellow:neon.green }}>{mlPredResult.cls}</div>
                        <div style={{ fontSize:9,color:"#6b8f80",marginTop:3 }}>CLASS</div>
                      </div>
                      <div style={{ textAlign:"center" }}>
                        <div style={{ fontSize:16,fontWeight:700,color:neon.cyan }}>{mlPredResult.trend}</div>
                        <div style={{ fontSize:9,color:"#6b8f80",marginTop:3 }}>TREND</div>
                      </div>
                    </div>
                    <div style={{ marginTop:10,fontSize:11,color:"#6b8f80" }}>
                      📍 {mlPredCity.name} · Temp: {mlPredTemp}°C · Pop Index: {mlPredCity.pop} · {mlPredWeekend?"Weekend":"Weekday"} · {mlPredEvent?"Event Day":"Normal Day"}
                    </div>
                  </div>
                )}
              </div>
            </div>

            <div style={S.card}>
              <div style={S.cardHead}>
                <span style={S.cardTitle}>≡ R Summary Terminal</span>
                <span style={{ fontSize:9,color:neon.green,border:`1px solid ${neon.green}44`,borderRadius:4,padding:"2px 6px" }}>In-Mem v3.1</span>
              </div>
              <div style={{ padding:14 }}>
                <div style={{ background:"#020705",border:"1px solid rgba(0,255,136,0.15)",borderRadius:8,padding:14,fontFamily:"'Courier New',monospace",fontSize:10,color:neon.green,lineHeight:1.8,maxHeight:320,overflowY:"auto" }}>
                  <div style={{ color:"#6b8f80" }}>&gt; summary(lm(formula = Waste_Kg ~ temp + population + weekend + event, data = historical_log))</div>
                  <br/>
                  <div style={{ color:"#cceedd" }}>Residuals:</div>
                  <div>&nbsp;&nbsp;&nbsp;&nbsp;Min &nbsp;&nbsp;&nbsp;&nbsp;1Q &nbsp;Median &nbsp;&nbsp;&nbsp;3Q &nbsp;&nbsp;&nbsp;&nbsp;Max</div>
                  <div>&nbsp;{frand(-20,-10).toFixed(3)} {frand(-5,-2).toFixed(3)} &nbsp;{frand(0,1).toFixed(3)} &nbsp;{frand(3,5).toFixed(3)} &nbsp;{frand(10,15).toFixed(3)}</div>
                  <br/>
                  <div style={{ color:"#cceedd" }}>Coefficients:</div>
                  <div style={{ color:"#6b8f80" }}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Estimate Std. Error t value Pr(&gt;|t|)</div>
                  <div>(Intercept) &nbsp;{mlSummary.intercept.toFixed(4)} &nbsp;{frand(3,5).toFixed(4)} &nbsp;{frand(3,5).toFixed(3)} &nbsp;<span style={{ color:neon.red }}>{frand(0.00001,0.001).toFixed(5)} ***</span></div>
                  <div>temp &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{mlSummary.b_temp.toFixed(4)} &nbsp;{frand(1,2).toFixed(4)} &nbsp;{frand(2,4).toFixed(3)} &nbsp;<span style={{ color:neon.red }}>{frand(0.001,0.01).toFixed(5)} **</span></div>
                  <div>population &nbsp;{mlSummary.b_pop.toFixed(4)} &nbsp;{frand(1,2).toFixed(4)} &nbsp;{frand(2,4).toFixed(3)} &nbsp;<span style={{ color:neon.red }}>{frand(0.001,0.05).toFixed(5)} *</span></div>
                  <div>weekend &nbsp;&nbsp;&nbsp;&nbsp;{mlSummary.b_weekend.toFixed(4)} &nbsp;{frand(5,10).toFixed(4)} &nbsp;{frand(2,4).toFixed(3)} &nbsp;<span style={{ color:neon.yellow }}>{frand(0.3,0.6).toFixed(5)} .</span></div>
                  <div>event &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{mlSummary.b_event.toFixed(4)} &nbsp;{frand(8,15).toFixed(4)} &nbsp;{frand(2,5).toFixed(3)} &nbsp;<span style={{ color:neon.red }}>{frand(0.00001,0.001).toFixed(5)} ***</span></div>
                  <br/>
                  <div style={{ color:"#6b8f80" }}>Signif. codes: 0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1</div>
                  <br/>
                  <div>Residual std. error: <span style={{ color:neon.yellow }}>{mlSummary.rse}</span> on {mlSummary.n - 5} DF</div>
                  <div>Multiple R-squared: <span style={{ color:neon.green }}>{mlSummary.r2}</span>,&nbsp; Adjusted R-squared: <span style={{ color:neon.cyan }}>{(mlSummary.r2 - 0.02).toFixed(4)}</span></div>
                  <div>F-statistic: <span style={{ color:neon.cyan }}>{frand(18,35).toFixed(1)}</span> on 4 and {mlSummary.n-5} DF, p-value: <span style={{ color:neon.red }}>&lt; 2.2e-16</span></div>
                  <br/>
                  <div style={{ color:neon.green }}>&gt; # City: {mlCity.name}</div>
                  <div style={{ color:neon.green }}>&gt; # Mean waste: {mlSummary.meanKg} kg/day · N={mlSummary.n} observations</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  };

  const Chatbot = () => {
    const chatEndRef = useRef(null);
    useEffect(()=>{ if(chatHistory.length>0||chatLoading) chatEndRef.current?.scrollIntoView({ behavior:"auto",block:"nearest" }); },[chatHistory,chatLoading]);
    return (
      <div style={{ display:"flex",flexDirection:"column",gap:16 }}>
        <div style={S.card}>
          <div style={S.cardHead}>
            <span style={S.cardTitle}>🤖 EcoBot — AI Assistant</span>
            <div style={{ display:"flex",alignItems:"center",gap:8 }}>
              {user&&<span style={{ fontSize:9,color:neon.green }}>☁️ Chats saved</span>}
              <span style={{ fontSize:10,color:neon.green,display:"flex",alignItems:"center",gap:5 }}><div style={S.pulse}/> Online</span>
              <button onClick={()=>setChatHistory([])} style={{ ...S.btn(neon.red,true),padding:"4px 8px",fontSize:8 }}>Clear</button>
            </div>
          </div>
          <div style={{ padding:"0 18px 12px" }}>
            <div style={{ height:260,overflowY:"auto",display:"flex",flexDirection:"column",gap:10,padding:"12px 0",scrollBehavior:"smooth" }}>
              {chatHistory.length===0&&(
                <div style={{ textAlign:"center",color:"#6b8f80",fontSize:12,padding:20 }}>
                  <div style={{ fontSize:28,marginBottom:8 }}>♻️</div>Ask me anything about waste management or recycling!
                </div>
              )}
              {chatHistory.map((m,i)=>(
                <div key={i} style={{ display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start" }}>
                  <div style={{ maxWidth:"80%",padding:"10px 14px",borderRadius:10,fontSize:12,lineHeight:1.6,background:m.role==="user"?`${neon.green}22`:"rgba(255,255,255,0.04)",border:`1px solid ${m.role==="user"?neon.green+"44":"rgba(255,255,255,0.08)"}`,color:m.role==="user"?"#e8fff5":"#cceedd" }}>
                    {m.role==="assistant"&&<span style={{ color:neon.green,marginRight:6 }}>🤖</span>}{m.content}
                  </div>
                </div>
              ))}
              {chatLoading&&(<div style={{ display:"flex",gap:4,padding:"8px 14px" }}>{[0,1,2].map(i=><div key={i} style={{ width:6,height:6,borderRadius:"50%",background:neon.green,animation:`bounce 1.2s ${i*0.2}s infinite` }}/>)}</div>)}
              <div ref={chatEndRef}/>
            </div>
            <div style={{ display:"flex",gap:10,borderTop:"1px solid rgba(0,255,136,0.1)",paddingTop:12 }}>
              <input style={S.input} placeholder="Ask about recycling, waste tips..." value={chatInput} onChange={e=>setChatInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendChat()}/>
              <button style={{ ...S.btn(neon.green),whiteSpace:"nowrap" }} onClick={sendChat} disabled={chatLoading}>Send</button>
            </div>
          </div>
        </div>
        <div style={S.card}>
          <div style={S.cardHead}><span style={S.cardTitle}>Quick Questions</span></div>
          <div style={{ ...S.cardBody,display:"flex",flexDirection:"column",gap:8 }}>
            {["How do I dispose of old medicines safely?","What can I compost at home?","How to reduce plastic waste?","What goes in the blue recycling bin?"].map(q=>(
              <button key={q} onClick={()=>sendChat(q)} style={{ textAlign:"left",padding:"10px 14px",fontSize:12,background:"rgba(0,229,255,0.04)",border:"1px solid rgba(0,229,255,0.15)",borderRadius:8,cursor:"pointer",color:"#cceedd",fontFamily:"'Courier New',monospace" }}>
                → {q}
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  };

  const Alerts = () => {
    const visibleAlerts = alertFilter==="all" ? alerts : alerts.filter(a=>a.type===alertFilter);
    const counts = { critical:alerts.filter(a=>a.type==="critical").length, warning:alerts.filter(a=>a.type==="warning").length, info:alerts.filter(a=>a.type==="info").length };
    const resolveAlert=(id)=>{ setAlerts(prev=>prev.filter(a=>a.id!==id)); if(selectedAlert?.id===id)setSelectedAlert(null); showToast("Alert resolved"); };
    const dispatchFromAlert=(alert)=>{ addAlert("info",`Truck dispatched for: ${alert.msg}`); showToast("Truck dispatched from alert"); };
    return (
      <div style={{ display:"flex",flexDirection:"column",gap:16 }}>
        <div style={S.grid3}>
          {[{label:"Critical",value:counts.critical,color:neon.red},{label:"Warning",value:counts.warning,color:neon.yellow},{label:"Info",value:counts.info,color:neon.cyan}].map((s,i)=>(
            <div key={i} style={{ ...S.card,padding:16,textAlign:"center",borderColor:`${s.color}44`,background:`${s.color}08` }}>
              <div style={{ ...S.statVal(s.color),fontSize:26 }}>{s.value}</div>
              <div style={S.statLabel}>{s.label} Alerts</div>
            </div>
          ))}
        </div>
        <div style={S.card}>
          <div style={S.cardHead}>
            <span style={S.cardTitle}>🔔 Live Alerts</span>
            <div style={{ display:"flex",gap:10,alignItems:"center" }}>
              {syncStatus.firestore==="live"&&<span style={{ fontSize:9,color:neon.green }}>● Firestore live</span>}
              <span style={{ fontSize:10,color:"#6b8f80" }}>{visibleAlerts.length} showing</span>
            </div>
          </div>
          <div style={{ padding:"14px 18px 0",display:"flex",gap:8,flexWrap:"wrap" }}>
            {[{id:"all",label:"All",color:neon.green},{id:"critical",label:"Critical",color:neon.red},{id:"warning",label:"Warning",color:neon.yellow},{id:"info",label:"Info",color:neon.cyan}].map(f=>(
              <button key={f.id} onClick={()=>setAlertFilter(f.id)} style={{ ...S.btn(f.color,alertFilter!==f.id),padding:"7px 12px",fontSize:9 }}>{f.label}</button>
            ))}
          </div>
          <div style={S.cardBody}>
            {visibleAlerts.length===0&&<div style={{ textAlign:"center",color:"#6b8f80",padding:28,fontSize:12 }}>No alerts in this category</div>}
            {visibleAlerts.map(a=>{
              const color=a.type==="critical"?neon.red:a.type==="warning"?neon.yellow:neon.cyan;
              return (
                <div key={a.id} onClick={()=>setSelectedAlert(a)}
                  style={{ cursor:"pointer",display:"grid",gridTemplateColumns:"32px 1fr auto",gap:12,alignItems:"center",padding:14,marginBottom:10,background:`${color}08`,border:`1px solid ${color}22`,borderRadius:10,borderLeft:`4px solid ${color}`,boxShadow:selectedAlert?.id===a.id?`0 0 18px ${color}33`:"none",transform:selectedAlert?.id===a.id?"translateX(4px)":"translateX(0)",transition:"all 0.25s ease" }}>
                  <div style={{ fontSize:18 }}>{a.type==="critical"?"🚨":a.type==="warning"?"⚠️":"ℹ️"}</div>
                  <div>
                    <div style={{ fontSize:12,color:"#e8fff5",marginBottom:3 }}>{a.msg}</div>
                    <div style={{ fontSize:10,color:"#6b8f80" }}>{a.time||"just now"}</div>
                  </div>
                  <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                    <span style={{ fontSize:10,color,textTransform:"uppercase",fontWeight:700 }}>{a.type}</span>
                    {a.type==="critical"&&<button onClick={e=>{e.stopPropagation();dispatchFromAlert(a);}} style={{ ...S.btn(neon.yellow,true),padding:"5px 8px",fontSize:8 }}>Send Truck</button>}
                    <button onClick={e=>{e.stopPropagation();resolveAlert(a.id);}} style={{ ...S.btn(neon.green,true),padding:"5px 8px",fontSize:8 }}>Resolve</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  };

  const REWARDS = [
    { id:1,title:"Plant a Tree",cost:500,icon:"🌱" },
    { id:2,title:"Eco Coupon",cost:800,icon:"🎟️" },
    { id:3,title:"Compost Kit",cost:1200,icon:"🪴" },
    { id:4,title:"Recycling Badge",cost:300,icon:"♻️" }
  ];
  const BADGES = [
    { id:"recycler",icon:"♻️",label:"Recycler",earned:true,bonus:20 },
    { id:"composter",icon:"🌱",label:"Composter",earned:true,bonus:25 },
    { id:"power",icon:"⚡",label:"Power User",earned:true,bonus:30 },
    { id:"hero",icon:"🌍",label:"Eco Hero",earned:points>=500,bonus:50 },
    { id:"zero",icon:"🔋",label:"Zero Waste",earned:points>=800,bonus:75 },
    { id:"city",icon:"🏙️",label:"City Saver",earned:points>=1200,bonus:100 }
  ];

  const redeemReward=(reward)=>{
    if(points<reward.cost){showToast("Not enough eco points");return;}
    const newPts=points-reward.cost; setPoints(newPts); savePoints(newPts); showToast(`${reward.title} redeemed!`);
  };
  const claimBadge=(badge)=>{
    setSelectedBadge(badge.id);
    if(!badge.earned){showToast(`${badge.label} badge is locked`);return;}
    if(claimedBadges.includes(badge.id)){showToast(`${badge.label} already claimed`);return;}
    const newPts=points+badge.bonus; setPoints(newPts); savePoints(newPts); setClaimedBadges(prev=>[...prev,badge.id]); showToast(`${badge.label} badge claimed +${badge.bonus} pts`);
  };

  const Rewards = () => {
    const levelPct = Math.round((points%500)/5);
    const liveLeaderboard = leaderboard.map(l=>l.isYou?{...l,pts:points}:l).sort((a,b)=>b.pts-a.pts).map((l,i)=>({...l,rank:i+1,badge:i===0?"🥇":i===1?"🥈":i===2?"🥉":"🏅"}));
    return (
      <div style={{ display:"flex",flexDirection:"column",gap:16 }}>
        <div style={{ ...S.card,background:"rgba(0,255,136,0.04)" }}>
          <div style={S.cardBody}>
            <div style={{ textAlign:"center",marginBottom:16 }}>
              <div style={{ fontSize:40,marginBottom:8 }}>🌿</div>
              <div style={{ ...S.statVal(neon.green),fontSize:40 }}>{points}</div>
              <div style={S.statLabel}>Eco Points {user?"(synced ☁️)":"(local)"}</div>
              <div style={{ fontSize:11,color:neon.yellow,marginTop:6 }}>{points<500?"Eco Starter":points<1000?"Recycler":points<1500?"Eco Champion":points<2000?"Green Hero":"Zero Waste Master"}</div>
            </div>
            <div style={{ background:"rgba(255,255,255,0.05)",borderRadius:100,height:8,margin:"0 20px",overflow:"hidden" }}>
              <div style={{ height:"100%",borderRadius:100,background:`linear-gradient(90deg,${neon.green},${neon.cyan})`,width:`${levelPct}%`,transition:"width 0.8s ease",boxShadow:`0 0 10px ${neon.green}` }}/>
            </div>
            <div style={{ textAlign:"center",fontSize:10,color:"#6b8f80",marginTop:6 }}>{levelPct}% to Level {level+1}</div>
          </div>
        </div>
        <div style={S.card}>
          <div style={S.cardHead}><span style={S.cardTitle}>🎁 Redeem Rewards</span></div>
          <div style={{ ...S.cardBody,display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10 }}>
            {REWARDS.map(r=>(
              <div key={r.id} style={{ padding:14,borderRadius:8,background:"rgba(0,255,136,0.05)",border:"1px solid rgba(0,255,136,0.18)",textAlign:"center" }}>
                <div style={{ fontSize:28,marginBottom:6 }}>{r.icon}</div>
                <div style={{ fontSize:12,color:"#e8fff5",marginBottom:4 }}>{r.title}</div>
                <div style={{ fontSize:10,color:neon.yellow,marginBottom:10 }}>{r.cost} pts</div>
                <button onClick={()=>redeemReward(r)} style={{ ...S.btn(points>=r.cost?neon.green:"#6b8f80",true),padding:"7px 10px",fontSize:9,width:"100%" }}>{points>=r.cost?"Redeem":"Locked"}</button>
              </div>
            ))}
          </div>
        </div>
        <div style={S.grid2}>
          <div style={S.card}>
            <div style={S.cardHead}><span style={S.cardTitle}>🏆 Leaderboard</span></div>
            <div style={S.cardBody}>
              {liveLeaderboard.map((l,i)=>(
                <div key={i} style={{ display:"flex",alignItems:"center",gap:12,padding:"10px 8px",borderBottom:"1px solid rgba(255,255,255,0.04)",background:l.isYou?"rgba(0,255,136,0.08)":"transparent",transform:l.isYou?"scale(1.02)":"scale(1)",transition:"all 0.35s ease",borderRadius:6 }}>
                  <span style={{ fontSize:16 }}>{l.badge}</span>
                  <span style={{ flex:1,fontSize:12,color:l.isYou?neon.green:"#e8fff5" }}>#{l.rank} {l.name}</span>
                  <span style={{ fontSize:11,color:neon.yellow,fontWeight:700 }}>{l.pts} pts</span>
                </div>
              ))}
            </div>
          </div>
          <div style={S.card}>
            <div style={S.cardHead}><span style={S.cardTitle}>🎖️ Badges</span><span style={{ fontSize:9,color:"#6b8f80" }}>Click to claim</span></div>
            <div style={{ ...S.cardBody,display:"grid",gridTemplateColumns:"1fr 1fr",gap:10 }}>
              {BADGES.map(b=>{
                const selected=selectedBadge===b.id; const claimed=claimedBadges.includes(b.id);
                return (
                  <button key={b.id} onClick={()=>claimBadge(b)} style={{ padding:12,textAlign:"center",borderRadius:8,background:b.earned?"rgba(0,255,136,0.08)":"rgba(255,255,255,0.02)",border:selected?`1px solid ${neon.yellow}`:`1px solid ${b.earned?"rgba(0,255,136,0.25)":"rgba(255,255,255,0.05)"}`,opacity:b.earned?1:0.4,cursor:"pointer",transform:selected?"translateY(-4px) scale(1.03)":"translateY(0) scale(1)",transition:"all 0.25s ease",boxShadow:selected?`0 0 18px ${neon.yellow}55`:"none",fontFamily:"'Courier New',monospace" }}>
                    <div style={{ fontSize:24,marginBottom:4 }}>{b.icon}</div>
                    <div style={{ fontSize:10,color:b.earned?neon.green:"#6b8f80",marginBottom:4 }}>{b.label}</div>
                    <div style={{ fontSize:9,color:claimed?neon.cyan:neon.yellow }}>{claimed?"CLAIMED":b.earned?`+${b.bonus} pts`:"LOCKED"}</div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    );
  };

  const TABS = [
    { id:"landing",   label:"Home" },
    { id:"dashboard", label:"Dashboard" },
    { id:"throw",     label:"Throw Waste" },
    { id:"ml",        label:"ML Predictor" },
    { id:"r_dashboard",label:"R Analytics" },
    { id:"classify",  label:"AI Classify" },
    { id:"map",       label:"Bin Map" },
    { id:"chat",      label:"EcoBot" },
    { id:"alerts",    label:`Alerts (${alerts.length})` },
    { id:"rewards",   label:"Leaderboard" },
  ];

  return (
    <div style={S.app}>
      <div style={S.grid}/>

      {showAuth&&fb&&(<AuthModal onClose={()=>setShowAuth(false)} onAuth={u=>{setUser(u);setShowAuth(false);}} fb={fb}/>)}

      {toast&&(
        <div style={{ position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",zIndex:9999,background:"rgba(5,10,14,0.95)",border:`1px solid ${toast.type==="success"?neon.green:neon.red}`,borderRadius:8,padding:"10px 20px",fontSize:12,color:toast.type==="success"?neon.green:neon.red,boxShadow:`0 0 20px ${toast.type==="success"?neon.green:neon.red}44`,animation:"fadeIn 0.3s ease",whiteSpace:"nowrap" }}>
          {toast.msg}
        </div>
      )}

      <nav style={S.nav}>
        <div style={S.logo}>ECO<span style={{ color:neon.cyan }}>SMART</span></div>
        {TABS.map(t=>(
          <button key={t.id} style={S.tab(activeTab===t.id)} onClick={()=>setActiveTab(t.id)}>{t.label}</button>
        ))}
        <div style={{ marginLeft:"auto",display:"flex",alignItems:"center",gap:12,flexShrink:0 }}>
          <div style={{ display:"flex",alignItems:"center",gap:6,fontSize:10,color:neon.green,whiteSpace:"nowrap" }}><div style={S.pulse}/> {points} pts</div>
          <FBStatus user={user} onSignIn={()=>setShowAuth(true)} onSignOut={async()=>{ if(fb){await fb.signOut(fb.auth);setUser(null);} }}/>
        </div>
      </nav>
      <AlertTicker />

      <div style={S.main}>
        {activeTab==="landing"    && <Landing/>}
        {activeTab==="dashboard"  && <Dashboard/>}
        {activeTab==="throw"      && <ThrowWaste/>}
        {activeTab==="classify"   && (
          <AIClassifier
            S={S}
            neon={neon}
            aiLoading={aiLoading}
            aiResult={aiResult}
            aiInput={aiInput}
            setAiInput={setAiInput}
            setAiResult={setAiResult}
            classifyWaste={classifyWaste}
            throwWaste={throwWaste}
            showToast={showToast}
          />
        )}
        {activeTab==="ml"         && <MLPredictor/>}
        {activeTab==="r_dashboard"&& (
          <div style={S.card}>
            <div style={S.cardHead}>
              <span style={S.cardTitle}>📊 Statistical Analysis Dashboard (R Shiny)</span>
              <span style={{ fontSize:10,color:neon.green }}>● Hosted on shinyapps.io</span>
            </div>
            <div style={{ ...S.cardBody,padding:0,overflow:"hidden",borderRadius:"0 0 12px 12px" }}>
              <iframe
                src="https://jee2920.shinyapps.io/smartecoplanet/"
                width="100%" height="720px"
                style={{ border:"none",display:"block",background:"#050a0e" }}
                title="EcoSmart R Dashboard"
              />
            </div>
          </div>
        )}
        {activeTab==="map"        && <MapTab/>}
        {activeTab==="chat"       && <Chatbot/>}
        {activeTab==="alerts"     && <Alerts/>}
        {activeTab==="rewards"    && <Rewards/>}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<EcoSmartApp/>);
</script>
</body>
</html>
