// ── Claude API ──────────────────────────────────────────────────────────────
async function callClaude(messages, systemPrompt = "", max_tokens = 800) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": "YOUR_API_KEY_HERE",
      "anthropic-version": "2023-06-01"
    },
    body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens, system: systemPrompt, messages }),
  });
  const data = await res.json();
  return data.content?.map(b => b.text || "").join("") || "No response.";
}

// ── Mini Map ────────────────────────────────────────────────────────────────
function BinMap({ bins, selectedBin, onSelect }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(0,255,136,0.06)"; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    const latMin=12.92,latMax=12.99,lngMin=77.57,lngMax=77.76;
    const toX = lng => ((lng-lngMin)/(lngMax-lngMin))*(W-60)+30;
    const toY = lat => H-((lat-latMin)/(latMax-latMin))*(H-60)+30-30;
    ctx.strokeStyle="rgba(0,229,255,0.12)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,H*0.45); ctx.lineTo(W,H*0.45); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W*0.5,0); ctx.lineTo(W*0.5,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,H*0.7); ctx.lineTo(W,H*0.3); ctx.stroke();
    ctx.strokeStyle="rgba(0,255,136,0.15)"; ctx.lineWidth=1; ctx.setLineDash([4,6]);
    for (let i=0;i<bins.length-1;i++) {
      ctx.beginPath(); ctx.moveTo(toX(bins[i].lng),toY(bins[i].lat)); ctx.lineTo(toX(bins[i+1].lng),toY(bins[i+1].lat)); ctx.stroke();
    }
    ctx.setLineDash([]);
    bins.forEach(bin => {
      const x=toX(bin.lng), y=toY(bin.lat);
      const isSelected=selectedBin?.id===bin.id;
      const color=bin.status==="critical"?neon.red:bin.status==="full"?neon.yellow:neon.green;
      if (isSelected||bin.status==="critical") {
        ctx.beginPath(); ctx.arc(x,y,22,0,Math.PI*2);
        ctx.strokeStyle=color+"55"; ctx.lineWidth=2; ctx.stroke();
      }
      const grad=ctx.createRadialGradient(x,y,2,x,y,16);
      grad.addColorStop(0,color+"cc"); grad.addColorStop(1,color+"00");
      ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
      ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2);
      ctx.fillStyle=color+"33"; ctx.strokeStyle=color; ctx.lineWidth=isSelected?3:1.5;
      ctx.fill(); ctx.stroke();
      ctx.fillStyle="#e8fff5"; ctx.font="10px monospace"; ctx.fillText(bin.name,x+14,y+4);
    });
  }, [bins, selectedBin]);

  const handleClick = (e) => {
    const canvas=canvasRef.current; const rect=canvas.getBoundingClientRect();
    const cx=(e.clientX-rect.left)*(canvas.width/rect.width);
    const cy=(e.clientY-rect.top)*(canvas.height/rect.height);
    const W=canvas.width,H=canvas.height;
    const latMin=12.92,latMax=12.99,lngMin=77.57,lngMax=77.76;
    const toX=lng=>((lng-lngMin)/(lngMax-lngMin))*(W-60)+30;
    const toY=lat=>H-((lat-latMin)/(latMax-latMin))*(H-60)+30-30;
    for (const bin of bins) {
      const bx=toX(bin.lng),by=toY(bin.lat);
      if (Math.hypot(cx-bx,cy-by)<20) { onSelect(bin); return; }
    }
    onSelect(null);
  };
  return <canvas ref={canvasRef} width={560} height={320} onClick={handleClick}
    style={{ width:"100%", height:"auto", cursor:"crosshair", borderRadius:12 }} />;
}

function BarChart({ data }) {
  const max = Math.max(...data.map(d=>d.value),1);
  return (
    <div style={{ display:"flex", alignItems:"flex-end", gap:6, height:80, padding:"0 4px" }}>
      {data.map((d,i) => (
        <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
          <div style={{ width:"100%", height:`${(d.value/max)*64}px`, background:`linear-gradient(180deg,${d.color}cc,${d.color}44)`,
            border:`1px solid ${d.color}88`, borderRadius:"4px 4px 0 0", transition:"height 0.8s", boxShadow:`0 0 8px ${d.color}44` }} />
          <span style={{ fontSize:9, color:"#6b8f80", letterSpacing:0.5 }}>{d.label}</span>
        </div>
      ))}
    </div>
  );
}

function Donut({ value, max=100, color, label }) {
  const r=44, circ=2*Math.PI*r, pct=Math.min(value/max,1);
  return (
    <div style={{ textAlign:"center" }}>
      <div style={{ position:"relative", width:110, height:110, margin:"0 auto 8px" }}>
        <svg width={110} height={110} viewBox="0 0 110 110" style={{ transform:"rotate(-90deg)" }}>
          <circle cx={55} cy={55} r={r} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth={10} />
          <circle cx={55} cy={55} r={r} fill="none" stroke={color} strokeWidth={10} strokeLinecap="round"
            strokeDasharray={circ} strokeDashoffset={circ*(1-pct)}
            style={{ transition:"stroke-dashoffset 1.2s", filter:`drop-shadow(0 0 6px ${color})` }} />
        </svg>
        <div style={{ position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", fontWeight:900 }}>
          <span style={{ fontSize:20, color }}>{value}%</span>
        </div>
      </div>
      <div style={{ fontSize:10, color:"#6b8f80", textTransform:"uppercase", letterSpacing:1 }}>{label}</div>
    </div>
  );
}

function useToast() {
  const [toast, setToast] = useState(null);
  const show = useCallback((msg, type="success") => {
    setToast({ msg, type }); setTimeout(() => setToast(null), 3000);
  }, []);
  return { toast, show };
}

// ── AUTH MODAL ──────────────────────────────────────────────────────────────
function AuthModal({ onClose, onAuth, fb }) {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const S = {
    overlay: { position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", zIndex:9999, display:"flex", alignItems:"center", justifyContent:"center", padding:20 },
    modal: { background:"#0a1614", border:"1px solid rgba(0,255,136,0.25)", borderRadius:16, padding:32, width:"100%", maxWidth:380, animation:"fadeIn 0.3s ease" },
    input: { background:"rgba(0,255,136,0.05)", border:"1px solid rgba(0,255,136,0.2)", borderRadius:8, padding:"11px 14px", color:"#e8fff5", fontSize:13, fontFamily:"'Courier New',monospace", outline:"none", width:"100%", marginBottom:10 },
    btn: (c=neon.green,outline=false) => ({ padding:"12px 20px", fontSize:12, letterSpacing:1.5, fontWeight:700, textTransform:"uppercase", background:outline?"transparent":c, color:outline?c:"#050a0e", border:`1px solid ${c}`, borderRadius:6, cursor:"pointer", fontFamily:"'Courier New',monospace", width:"100%" }),
  };

  const handle = async () => {
    if (!email || !password) return setError("Fill all fields");
    setLoading(true); setError("");
    try {
      if (mode === "signup") {
        if (!name) return setError("Enter your name");
        const cred = await fb.createUserWithEmailAndPassword(fb.auth, email, password);
        await fb.updateProfile(cred.user, { displayName: name });
        // Save user to Firestore
        await fb.setDoc(fb.doc(fb.db, "users", cred.user.uid), {
          name, email, points: 0, level: 1, createdAt: fb.serverTimestamp()
        });
        onAuth(cred.user);
      } else {
        const cred = await fb.signInWithEmailAndPassword(fb.auth, email, password);
        onAuth(cred.user);
      }
    } catch(e) {
      setError(e.message || e.code || "Login failed. Check console.");
console.log("Firebase error:", e);
    }
    setLoading(false);
  };

  return (
    <div style={S.overlay} onClick={e => e.target===e.currentTarget && onClose()}>
      <div style={S.modal}>
        <div style={{ fontSize:11, color:neon.green, letterSpacing:2, marginBottom:6 }}>// ECOSMART</div>
        <div style={{ fontSize:22, fontWeight:900, color:"#e8fff5", marginBottom:4 }}>
          {mode==="login" ? "Welcome Back" : "Join EcoSmart"}
        </div>
        <div style={{ fontSize:11, color:"#6b8f80", marginBottom:24 }}>
          {mode==="login" ? "Sign in to sync your eco data" : "Create account to track your impact"}
        </div>

        {mode==="signup" && (
          <input style={S.input} placeholder="Your name" value={name} onChange={e=>setName(e.target.value)} />
        )}
        <input style={S.input} placeholder="Email" type="email" value={email} onChange={e=>setEmail(e.target.value)} />
        <input style={S.input} placeholder="Password" type="password" value={password} onChange={e=>setPassword(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&handle()} />

        {error && <div style={{ fontSize:11, color:neon.red, marginBottom:10 }}>⚠ {error}</div>}

        <button style={{ ...S.btn(), opacity:loading?0.6:1, marginBottom:10 }} onClick={handle} disabled={loading}>
          {loading ? "..." : mode==="login" ? "Sign In →" : "Create Account →"}
        </button>
        <button style={{ ...S.btn(neon.cyan, true) }} onClick={() => { setMode(m=>m==="login"?"signup":"login"); setError(""); }}>
          {mode==="login" ? "New here? Sign up" : "Have account? Sign in"}
        </button>

        <button onClick={onClose} style={{ background:"none", border:"none", color:"#6b8f80", fontSize:11, cursor:"pointer", width:"100%", marginTop:12 }}>
          Continue without account
        </button>
      </div>
    </div>
  );
}

// ── MAIN APP ────────────────────────────────────────────────────────────────
function EcoSmartApp() {
  const [fb, setFb] = useState(null);
  const [activeTab, setActiveTab] = useState("landing");
  const [user, setUser] = useState(null);
  const [showAuth, setShowAuth] = useState(false);
  const [fbReady, setFbReady] = useState(false);

  // State
  const [wetPct, setWetPct] = useState(68);
  const [dryPct, setDryPct] = useState(32);
  const [hazPct, setHazPct] = useState(8);
  const [battPct, setBattPct] = useState(87);
  const [points, setPoints] = useState(340);
  const [level, setLevel] = useState(3);
  const [selectedBin, setSelectedBin] = useState(null);
  const [bins, setBins] = useState(INIT_BINS);
  const [throwLog, setThrowLog] = useState([]);
  const [lastThrown, setLastThrown] = useState(null);
const [wasteFilter, setWasteFilter] = useState("all");
const [alertFilter, setAlertFilter] = useState("all");
  const [alerts, setAlerts] = useState([
    { id: 1, type:"critical", msg:"Whitefield bin 94% full — collection needed", time:"2m ago" },
    { id: 2, type:"warning", msg:"Koramangala bin 88% wet — composting alert", time:"8m ago" },
    { id: 3, type:"info", msg:"MG Road bin battery at 87%", time:"15m ago" },
  ]);
  const [selectedAlert, setSelectedAlert] = useState(null);
  const [weeklyData, setWeeklyData] = useState([
    { label:"Mon", value:42, color:neon.green }, { label:"Tue", value:68, color:neon.cyan },
    { label:"Wed", value:55, color:neon.green }, { label:"Thu", value:91, color:neon.yellow },
    { label:"Fri", value:74, color:neon.green }, { label:"Sat", value:38, color:neon.cyan },
    { label:"Sun", value:62, color:neon.green },
  ]);
  const [co2Saved] = useState(2.34);
  const [tipIdx, setTipIdx] = useState(0);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiResult, setAiResult] = useState(null);
  const [aiInput, setAiInput] = useState("");
  const [chatHistory, setChatHistory] = useState([]);
  const [chatInput, setChatInput] = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const [routeOptimizing, setRouteOptimizing] = useState(false);
  const [optimizedRoute, setOptimizedRoute] = useState(null);
  const [truckRoute, setTruckRoute] = useState([]);
  const [leaderboard, setLeaderboard] = useState([
    { rank:1, name:"Jeon Jungkook.", pts:1240, badge:"🥇" },
    { rank:2, name:"Taehyung.", pts:980, badge:"🥈" },
    { rank:3, name:"You", pts:340, badge:"🥉", isYou:true },
    { rank:4, name:"Kim Namjoon.", pts:290, badge:"🏅" },
    { rank:5, name:"Kim Seokjin.", pts:210, badge:"🏅" },
  ]);
  const [syncStatus, setSyncStatus] = useState({ firestore:"idle", rtdb:"idle", auth:"idle" });
  const { toast, show: showToast } = useToast();

  // ── Init Firebase ──
  useEffect(() => {
    waitForFirebase().then(f => {
      setFb(f); setFbReady(true);
      setSyncStatus(s => ({ ...s, auth:"connected" }));

      // Auth listener
      f.onAuthStateChanged(f.auth, async (u) => {
        setUser(u);
        if (u) {
          setSyncStatus(s => ({ ...s, auth:"signed_in" }));
          // Load user data from Firestore
          try {
            const snap = await f.getDoc(f.doc(f.db, "users", u.uid));
            if (snap.exists()) {
              const data = snap.data();
              if (data.points) setPoints(data.points);
              if (data.level) setLevel(data.level);
            }
          } catch {}

          // Subscribe to realtime bin data from RTDB
          const binsRef = f.ref(f.rtdb, "bins");
          f.onValue(binsRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
              const updated = INIT_BINS.map(b => {
                const live = data[b.id];
                return live ? { ...b, ...live } : b;
              });
              setBins(updated);
              setSyncStatus(s => ({ ...s, rtdb:"live" }));
            }
          });

          // Subscribe to Firestore alerts
          const alertsQ = f.query(f.collection(f.db, "alerts"), f.orderBy("createdAt","desc"), f.limit(10));
          f.onSnapshot(alertsQ, (snap) => {
            if (!snap.empty) {
              const firestoreAlerts = snap.docs.map(d => ({ id:d.id, ...d.data() }));
              setAlerts(prev => {
                const merged = [...firestoreAlerts, ...prev.filter(a=>typeof a.id==="number")];
                return merged.slice(0,12);
              });
              setSyncStatus(s => ({ ...s, firestore:"live" }));
            }
          });

          showToast(`Welcome back, ${u.displayName || "Eco Warrior"}! 🌿`);
        } else {
          setSyncStatus(s => ({ ...s, auth:"connected", firestore:"idle", rtdb:"idle" }));
        }
      });
    });
  }, []);

  // ── Live sensor simulation + RTDB sync ──
  useEffect(() => {
    const t = setInterval(() => {
      setWetPct(prev => { const v=Math.min(100,Math.max(20,prev+rand(-2,5))); if (v > 90 && alerts[0]?.msg !== "Wet waste bin almost full!") {
  addAlert("critical", "Wet waste bin almost full!");
} return v; });
      setDryPct(prev => Math.min(100,Math.max(10,prev+rand(-3,4))));
      setHazPct(prev => Math.min(100,Math.max(5,prev+rand(-1,2))));
      setBattPct(prev => Math.max(10,prev-0.2));
      setWeeklyData(prev => prev.map(d => ({ ...d, value:Math.max(20,Math.min(100,d.value+rand(-8,8))) })));

  setBins(prev => {
  const updated = prev.map(bin => {
    const wet = Math.min(100, Math.max(5, bin.wet + rand(-8, 4)));
    const dry = Math.min(100, Math.max(5, bin.dry + rand(-8, 4)));
    const maxFill = Math.max(wet, dry);

    return {
      ...bin,
      wet,
      dry,
      temp:parseFloat((Number(bin.temp) + (Math.random() * 2 - 1)).toFixed(1)),
      status:
        maxFill >= 90 ? "critical" :
        maxFill >= 75 ? "full" :
        "normal"
    };
  });

       // Push to RTDB if user logged in
        if (fb && user) {
          updated.forEach(bin => {
            try { fb.set(fb.ref(fb.rtdb,`bins/${bin.id}`), { wet:bin.wet, dry:bin.dry, temp:bin.temp, status:bin.status, updatedAt:Date.now() }); } catch {}
          });
        }
        return updated;
      });
    }, 10000);
    return () => clearInterval(t);
  }, [fb, user]);

  // ── Add alert helper ──
  const addAlert = useCallback(async (type, msg) => {
    const a = { id:Date.now(), type, msg, time:"just now" };
    setAlerts(prev => [a, ...prev].slice(0,12));
    
  }, [fb, user]);

  // ── Save points to Firestore ──
  const savePoints = useCallback(async (newPts) => {
    if (!fb || !user) return;
    try {
      await fb.updateDoc(fb.doc(fb.db,"users",user.uid), { points:newPts, lastActive:fb.serverTimestamp() });
      setSyncStatus(s => ({ ...s, firestore:"synced" }));
    } catch {}
  }, [fb, user]);

  // ── Throw waste ──
 const throwWaste = async (item) => {
  const newLog = { ...item, time:new Date().toLocaleTimeString() };

  setLastThrown(newLog);
  setThrowLog(prev => [newLog, ...prev].slice(0, 15));

  if (item.type === "wet") {
    setWetPct(v => Math.min(100, v + rand(1, 5)));
  } else if (item.type === "dry") {
    setDryPct(v => Math.min(100, v + rand(1, 4)));
  } else {
    setHazPct(v => Math.min(100, v + rand(2, 8)));
  }

  const newPts = points + item.points;
  setPoints(newPts);

  showToast(`+${item.points} pts - ${item.name} sorted`);

  if (fb && user) {
    try {
      await fb.addDoc(fb.collection(fb.db, "throwLog"), {
        ...item,
        userId:user.uid,
        createdAt:fb.serverTimestamp()
      });

      await savePoints(newPts);
      setSyncStatus(s => ({ ...s, firestore:"synced" }));
      showToast(`+${item.points} pts - Synced to cloud`);
    } catch (e) {
      console.log("Throw log save failed:", e);
      showToast(`+${item.points} pts - ${item.name} sorted locally`);
    }
  }

  if (item.type === "wet" && wetPct > 80) {
    addAlert("warning", `High wet waste: ${item.name} disposal logged`);
  }
};

  // ── AI Classify ──
  const classifyWaste = async (inputVal) => {
  const isFile = inputVal instanceof File;

  if (!isFile && (!inputVal || !inputVal.trim())) return;

  setAiLoading(true);
  setAiResult(null);

  if (isFile) {
    // ── INSTANT preview using object URL (no FileReader delay) ──
    const previewURL = URL.createObjectURL(inputVal);
    // Dispatch custom event so CameraUploader picks it up instantly
    window.__ecoPreviewUrl = previewURL;

    const formData = new FormData();
    formData.append("file", inputVal);

    try {
      const API_URL = "https://ecosmart-ml-api.onrender.com/predict";

      // Start fetch immediately — don't wait for anything
      const response = await fetch(API_URL, {
        method: "POST",
        body: formData
      });

      if (!response.ok) throw new Error(`API error: ${response.statusText}`);

      const data = await response.json();

      setAiResult({
        category: data.color === "dry" ? "dry" : "wet",
        confidence: data.confidence,
        bin_color: data.color === "dry" ? "Blue" : "Green",
        points: data.label === "DRY WASTE" ? 10 : 5,
        recyclable: data.color === "dry",
        composable: data.color === "wet",
        co2_impact: data.color === "dry" ? "Medium" : "Low",
        disposal_tip: data.tip,
        eco_fact: data.color === "wet"
          ? "Food waste in landfills produces methane. Composting avoids this!"
          : "Recycling dry items saves precious landfill space and energy."
      });

      const newPts = points + (data.label === "DRY WASTE" ? 10 : 5);
      setPoints(newPts);
      if (fb && user) savePoints(newPts);
      showToast("Waste classified by ML model! 📸");

    } catch (error) {
      console.error("ML API offline, using fallback:", error);

      // ── Smart fallback using actual image content via canvas ──
      const img = new Image();
      img.src = previewURL;
      await new Promise(res => { img.onload = res; img.onerror = res; });

      const canvas = document.createElement("canvas");
      canvas.width = 4; canvas.height = 4;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, 4, 4);
      const px = ctx.getImageData(0, 0, 4, 4).data;
      // Average green channel — organic/wet items tend greener
      let avgR = 0, avgG = 0, avgB = 0;
      for (let i = 0; i < px.length; i += 4) {
        avgR += px[i]; avgG += px[i+1]; avgB += px[i+2];
      }
      const n = px.length / 4;
      avgR /= n; avgG /= n; avgB /= n;

      // Also check filename
      const fileName = inputVal.name.toLowerCase();
      const wetKeywords = ["banana","food","apple","waste","vegetable","leaf","fruit","organic","peel","egg"];
      const hazKeywords = ["battery","medicine","bulb","chemical","paint","sanitizer"];
      const eKeywords   = ["laptop","mobile","phone","charger","earphone","keyboard"];

      let estCategory = "dry";
      let estTip = "Please dispose in the BLUE bin. Recyclable items like plastic, paper, cardboard.";
      let estPts = 10;
      let estConf = 72;

      if (hazKeywords.some(k => fileName.includes(k))) {
        estCategory = "hazardous"; estTip = "Dispose at a hazardous waste collection center."; estPts = 20; estConf = 85;
      } else if (eKeywords.some(k => fileName.includes(k))) {
        estCategory = "e-waste"; estTip = "Send to a certified e-waste recycler."; estPts = 25; estConf = 88;
      } else if (wetKeywords.some(k => fileName.includes(k)) || (avgG > avgR + 10 && avgG > avgB + 10)) {
        estCategory = "wet"; estTip = "Please dispose in the GREEN bin. Biodegradable items like food scraps, peels."; estPts = 5; estConf = 68;
      }

      setAiResult({
        category: estCategory,
        confidence: estConf,
        bin_color: estCategory === "dry" ? "Blue" : estCategory === "wet" ? "Green" : estCategory === "hazardous" ? "Red" : "Purple",
        points: estPts,
        recyclable: estCategory === "dry" || estCategory === "e-waste",
        composable: estCategory === "wet",
        co2_impact: estCategory === "hazardous" || estCategory === "e-waste" ? "High" : estCategory === "wet" ? "Low" : "Medium",
        disposal_tip: `[Offline] ${estTip}`,
        eco_fact: "Deploy your Flask backend on Render to get accurate TensorFlow predictions."
      });

      const newPts = points + estPts;
      setPoints(newPts);
      if (fb && user) savePoints(newPts);
      showToast("Backend offline — smart fallback used", "error");

    } finally {
      setAiLoading(false);
      // Free memory
      URL.revokeObjectURL(previewURL);
    }

  } else {
    // ── TEXT classification — instant, no timeout needed ──
    setAiInput(inputVal);
    const item = inputVal.toLowerCase();

    let result = {
      category: "dry", confidence: 90, bin_color: "Blue", points: 10,
      recyclable: true, composable: false, co2_impact: "Medium",
      disposal_tip: "Dispose in dry waste bin.",
      eco_fact: "Recycling helps reduce landfill waste."
    };

    if (["food","vegetable","fruit","leaves","banana","peel","apple","egg","tea","coffee","rice","bread","oil"].some(k => item.includes(k))) {
      result = { category:"wet", confidence:96, bin_color:"Green", points:5, recyclable:false, composable:true, co2_impact:"Low",
        disposal_tip:"Dispose in wet waste bin or compost.",
        eco_fact:"Fruit peels and food scraps are compostable organic waste." };
    }

    if (["battery","medicine","bulb","chemical","paint","sanitizer"].some(k => item.includes(k))) {
      result = { category:"hazardous", confidence:98, bin_color:"Red", points:20, recyclable:false, composable:false, co2_impact:"High",
        disposal_tip:"Dispose at a hazardous waste collection center.",
        eco_fact:"Hazardous waste can pollute groundwater if dumped improperly." };
    }

    if (["laptop","mobile","phone","charger","earphone","keyboard"].some(k => item.includes(k))) {
      result = { category:"e-waste", confidence:97, bin_color:"Purple", points:25, recyclable:true, composable:false, co2_impact:"High",
        disposal_tip:"Send to a certified e-waste recycler.",
        eco_fact:"E-waste contains recoverable metals and must not go to regular bins." };
    }

    // Instant — no setTimeout
    setAiResult(result);
    const newPts = points + result.points;
    setPoints(newPts);
    if (fb && user) savePoints(newPts);
    showToast("Waste classified!");
    setAiLoading(false);
  }
};

  // ── Route Optimizer ──
  const optimizeRoute = async () => {
  setRouteOptimizing(true);

  setTimeout(() => {
    const urgentBins = bins
      .filter(b => b.status === "critical" || b.status === "full" || b.wet >= 75 || b.dry >= 75)
      .sort((a, b) => {
        const scoreA = Math.max(a.wet, a.dry);
        const scoreB = Math.max(b.wet, b.dry);
        return scoreB - scoreA;
      });

    const manualBins = truckRoute;

    const merged = [...manualBins];

    urgentBins.forEach(bin => {
      if (!merged.some(b => b.id === bin.id)) {
        merged.push(bin);
      }
    });

    const finalRoute = merged.slice(0, 8);

    setTruckRoute(finalRoute);

    setOptimizedRoute({
      route: finalRoute.map(b => b.name),
      priority: "critical_and_full_bins_first",
      estimated_time: `${finalRoute.length * 12} mins`,
      fuel_saved: `${(finalRoute.length * 0.35).toFixed(1)}L`,
      co2_reduction: `${(finalRoute.length * 0.8).toFixed(1)} kg`,
      reasoning: "Route includes manually dispatched bins plus critical/full bins sorted by fill level."
    });

    addAlert("info", `AI optimized truck route with ${finalRoute.length} stops`);
    showToast("AI route optimized");
    setRouteOptimizing(false);
  }, 800);
};
   

  // ── Chat ──
  const localEcoReply = (text) => {
  const q = text.toLowerCase();

  if (q.includes("medicine") || q.includes("tablet") || q.includes("syrup")) {
    return "Old medicines should not be thrown into regular bins. Keep them in original packaging and give them to a pharmacy take-back point or hazardous waste collection center.";
  }

  if (q.includes("compost") || q.includes("wet") || q.includes("food")) {
    return "You can compost fruit peels, vegetable scraps, tea leaves, coffee grounds, eggshells, and dry leaves. Avoid meat, plastic, glass, and oily food in home compost.";
  }

  if (q.includes("plastic")) {
    return "Reduce plastic by carrying a reusable bottle, cloth bag, and lunch box. Clean dry plastic bottles can go into dry waste, but dirty plastic should be rinsed first.";
  }

  if (q.includes("blue") || q.includes("recycling")) {
    return "The blue/dry recycling bin is for clean paper, cardboard, plastic bottles, metal cans, and glass. Keep items dry and empty before disposal.";
  }

  if (q.includes("battery") || q.includes("bulb") || q.includes("chemical")) {
    return "Batteries, bulbs, chemicals, and paints are hazardous waste. Do not mix them with wet or dry waste. Send them to a certified hazardous waste collection point.";
  }

  if (q.includes("phone") || q.includes("laptop") || q.includes("charger") || q.includes("e-waste")) {
    return "E-waste like phones, laptops, chargers, and keyboards should go to certified e-waste recyclers. They contain metals that can be recovered safely.";
  }

  return "For best waste sorting: wet waste goes to compost, clean recyclable items go to dry waste, and batteries, medicines, bulbs, and electronics need special collection.";
};

const sendChat = async (text = chatInput) => {
  if (!text.trim()) return;

  const userMsg = { role:"user", content:text };
  setChatHistory(prev => [...prev, userMsg]);
  setChatInput("");
  setChatLoading(true);

  setTimeout(async () => {
    let reply = localEcoReply(text);

    try {
      if (fb && user) {
        await fb.addDoc(fb.collection(fb.db, "chats"), {
          userId:user.uid,
          userMsg:text,
          botMsg:reply,
          createdAt:fb.serverTimestamp()
        });

};

  const S = {
app: { minHeight:"100vh", background:"#050a0e", color:"#e8fff5", fontFamily:"'Courier New',monospace", position:"relative", overflowX:"hidden" },    grid: { position:"fixed", inset:0, pointerEvents:"none", zIndex:0, backgroundImage:"linear-gradient(rgba(0,255,136,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.03) 1px,transparent 1px)", backgroundSize:"40px 40px" },

    main: { position:"relative", zIndex:1, maxWidth:1200, margin:"0 auto", padding:"16px", width:"100%", boxSizing:"border-box" },
    card: { background:"rgba(10,22,20,0.85)", border:"1px solid rgba(0,255,136,0.15)", borderRadius:12, backdropFilter:"blur(20px)", overflowX:"hidden" },
    cardHead: { padding:"14px 18px", borderBottom:"1px solid rgba(0,255,136,0.1)", display:"flex", alignItems:"center", justifyContent:"space-between" },
    cardTitle: { fontSize:11, letterSpacing:2, color:neon.green, textTransform:"uppercase" },
    cardBody: { padding:18 },
    statVal: (color) => ({ fontWeight:900, fontSize:28, color, textShadow:`0 0 16px ${color}88`, fontFamily:"'Courier New',monospace" }),
    statLabel: { fontSize:10, color:"#6b8f80", textTransform:"uppercase", letterSpacing:1, marginTop:2 },
    btn: (color=neon.green, outline=false) => ({ padding:"10px 20px", fontSize:11, letterSpacing:1.5, fontWeight:700, textTransform:"uppercase", background:outline?"transparent":color, color:outline?color:"#050a0e", border:`1px solid ${color}`, borderRadius:6, cursor:"pointer", fontFamily:"'Courier New',monospace", transition:"all 0.2s", boxShadow:outline?"none":`0 0 16px ${color}44` }),
    input: { background:"rgba(0,255,136,0.05)", border:"1px solid rgba(0,255,136,0.2)", borderRadius:8, padding:"10px 14px", color:"#e8fff5", fontSize:13, fontFamily:"'Courier New',monospace", outline:"none", width:"100%" },
    grid2: { display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))", gap:12 },
    grid3: { display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:12 },
    pulse: { width:8, height:8, borderRadius:"50%", background:neon.green, boxShadow:`0 0 8px ${neon.green}`, animation:"pulse 1.5s infinite" },
  };

  // ── Firebase Status Panel ──
  const FBPanel = () => (
    <div style={{ ...S.card, marginBottom:12, background:"rgba(0,229,255,0.03)", borderColor:"rgba(0,229,255,0.15)" }}>
      <div style={{ padding:"10px 16px", display:"flex", alignItems:"center", gap:16, flexWrap:"wrap" }}>
        <span style={{ fontSize:10, color:neon.cyan, letterSpacing:1.5 }}>// FIREBASE STATUS</span>
        {[
          { label:"AUTH", status:syncStatus.auth },
          { label:"FIRESTORE", status:syncStatus.firestore },
          { label:"REALTIME DB", status:syncStatus.rtdb },
        ].map(s => {
          const color = s.status==="live"||s.status==="synced"||s.status==="signed_in"||s.status==="connected" ? neon.green : s.status==="idle" ? "#6b8f80" : neon.yellow;
          return (
            <div key={s.label} style={{ display:"flex", alignItems:"center", gap:6 }}>
              <div style={{ width:6,height:6,borderRadius:"50%",background:color,boxShadow:s.status!=="idle"?`0 0 6px ${color}`:undefined }} />
              <span style={{ fontSize:9, color:"#6b8f80", letterSpacing:1 }}>{s.label}</span>
              <span style={{ fontSize:9, color, fontWeight:700 }}>{s.status.toUpperCase()}</span>
            </div>
          );

function CameraUploader({ onFile, showToast, S, neon }) {
  const videoRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const fileInputRef = React.useRef(null);
  const [streaming, setStreaming] = React.useState(false);
  const [previewUrl, setPreviewUrl] = React.useState(null);
  const [camError, setCamError] = React.useState("");

  const startCamera = async () => {
    setCamError("");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setCamError("Camera API not available. Open via http://localhost or https://");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
        setStreaming(true);
      }
    } catch (e) {
      const msg =
        e.name === "NotAllowedError" ? "Camera permission denied. Allow camera in browser settings." :
        e.name === "NotFoundError" ? "No camera found on this device." :
        e.name === "NotReadableError" ? "Camera is in use by another app." :
        `Camera error: ${e.message}`;
      setCamError(msg);
      showToast(msg, "error");
    }
  };

  const stopCamera = () => {
    if (videoRef.current?.srcObject) {
      videoRef.current.srcObject.getTracks().forEach(t => t.stop());
      videoRef.current.srcObject = null;
    }
    setStreaming(false);
  };

  const captureFrame = () => {
    const video = videoRef.current;
    const canvas = canvasRef.current;
    if (!video || !canvas) return;
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext("2d").drawImage(video, 0, 0);
    canvas.toBlob(blob => {
      if (!blob) return;
      const file = new File([blob], "capture.jpg", { type: "image/jpeg" });
      // Show preview immediately before classification
      const url = URL.createObjectURL(blob);
      setPreviewUrl(url);
      onFile(file);
      stopCamera();
    }, "image/jpeg", 0.92);
  };

  const handleFileChange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  setPreviewUrl(url);
  onFile(file);
  e.target.value = "";
};
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      <input
        type="file"
        ref={fileInputRef}
        onChange={handleFileChange}
        accept="image/*"
        style={{ display: "none" }}
      />
      <canvas ref={canvasRef} style={{ display: "none" }} />

      {streaming ? (
        <div style={{ position: "relative", borderRadius: 12, overflow: "hidden", border: `1px solid ${neon.green}` }}>
          <video
            ref={videoRef}
            autoPlay
            playsInline
            muted
            style={{ width: "100%", maxHeight: 280, objectFit: "cover", display: "block", background: "#000" }}
          />
          <div style={{
            display: "flex", gap: 10, padding: "10px 12px",
            background: "rgba(0,0,0,0.75)", backdropFilter: "blur(4px)",
            position: "absolute", bottom: 0, width: "100%", boxSizing: "border-box"
          }}>
            <button onClick={captureFrame} style={{ ...S.btn(neon.green), flex: 1, fontSize: 12 }}>
              📸 Capture
            </button>
            <button onClick={stopCamera} style={{ ...S.btn(neon.red, true), flex: 1, fontSize: 12 }}>
              ✕ Cancel
            </button>
          </div>
        </div>
      ) : previewUrl ? (
        <div style={{ position: "relative", textAlign: "center" }}>
          <img
            src={previewUrl}
            alt="Waste preview"
            style={{ maxHeight: 200, maxWidth: "100%", borderRadius: 10, border: `1px solid ${neon.green}44` }}
          />
          {/* Clear button so user can upload a fresh image */}
          <button
            onClick={() => { setPreviewUrl(null); }}
            style={{
              position: "absolute", top: 8, right: 8,
              background: "rgba(0,0,0,0.7)", border: `1px solid ${neon.red}`,
              borderRadius: "50%", width: 28, height: 28,
              color: neon.red, cursor: "pointer", fontSize: 14,
              display: "flex", alignItems: "center", justifyContent: "center"
            }}
          >×</button>
          <div style={{ fontSize: 11, color: neon.cyan, marginTop: 6 }}>
            Image loaded — classifying...
          </div>
        </div>
      ) : (
        <div
          onClick={() => fileInputRef.current?.click()}
          style={{
            border: "1px dashed rgba(0,255,136,0.3)", borderRadius: 12,
            padding: "30px 16px", textAlign: "center", cursor: "pointer",
            background: "rgba(0,255,136,0.02)", transition: "border-color 0.2s"
          }}
          onMouseEnter={e => e.currentTarget.style.borderColor = neon.green}
          onMouseLeave={e => e.currentTarget.style.borderColor = "rgba(0,255,136,0.3)"}
        >
          <div style={{ fontSize: 36, marginBottom: 10 }}>📸</div>
          <div style={{ fontSize: 13, color: "#e8fff5", fontWeight: "bold", marginBottom: 4 }}>
            Click to upload waste image
          </div>
          <div style={{ fontSize: 10, color: "#6b8f80" }}>JPG / PNG · 224×224 RGB → TensorFlow</div>
        </div>
      )}

      {camError && (
        <div style={{
          padding: "10px 14px", borderRadius: 8, fontSize: 11,
          background: "rgba(255,61,113,0.08)", border: "1px solid rgba(255,61,113,0.3)",
          color: neon.red, lineHeight: 1.6
        }}>
          ⚠ {camError}
          {camError.includes("localhost") && (
            <div style={{ marginTop: 6, color: "#6b8f80" }}>
              Run: <code style={{ color: neon.cyan }}>python -m http.server 8080</code> then open{" "}
              <code style={{ color: neon.cyan }}>http://localhost:8080</code>
            </div>
          )}
        </div>
      )}

      <div style={{ display: "flex", gap: 10 }}>
        <button onClick={() => fileInputRef.current?.click()}
          style={{ ...S.btn(neon.cyan, true), flex: 1, fontSize: 11 }}>
          🖼️ Upload from Gallery
        </button>
        
        
      </div>
    </div>
  );
}

  const newPts = points - reward.cost;
  setPoints(newPts);
  savePoints(newPts);
  showToast(`${reward.title} redeemed successfully`);
};

  setSelectedBadge(badge.id);

  if (!badge.earned) {
    showToast(`${badge.label} badge is locked`);
    return;
  }

  if (claimedBadges.includes(badge.id)) {
    showToast(`${badge.label} already claimed`);

  const newPts = points + badge.bonus;
  setPoints(newPts);
  savePoints(newPts);
  setClaimedBadges(prev => [...prev, badge.id]);
  showToast(`${badge.label} badge claimed +${badge.bonus} pts`);
};

            <div style={{ ...S.statVal(neon.green), fontSize:40 }}>{points}</div>
            <div style={S.statLabel}>Eco Points {user ? "(synced ☁️)" : "(local)"}</div>
            <div style={{ fontSize:11, color:neon.yellow, marginTop:6 }}>
              Level {Math.floor(points / 500) + 1} — {
  points < 500 ? "Eco Starter" :
  points < 1000 ? "Recycler" :
  points < 1500 ? "Eco Champion" :
  points < 2000 ? "Green Hero" :
  "Zero Waste Master"
}
            </div>
          </div>

          <div style={{ background:"rgba(255,255,255,0.05)", borderRadius:100, height:8, margin:"0 20px", overflow:"hidden" }}>
            <div style={{
              height:"100%",
              borderRadius:100,
              background:`linear-gradient(90deg,${neon.green},${neon.cyan})`,
              width:`${levelPct}%`,
              transition:"width 0.8s ease",
              boxShadow:`0 0 10px ${neon.green}`
            }} />
          </div>

          <div style={{ textAlign:"center", fontSize:10, color:"#6b8f80", marginTop:6 }}>
            {levelPct}% to Level {level + 1}
          </div>
        </div>
      </div>

      <div style={S.card}>
        <div style={S.cardHead}>
          <span style={S.cardTitle}>🎁 Redeem Rewards</span>
        </div>

        <div style={{
          ...S.cardBody,
          display:"grid",
          gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",
          gap:10
        }}>
          {REWARDS.map(reward => (
            <div key={reward.id} style={{
              padding:14,
              borderRadius:8,
              background:"rgba(0,255,136,0.05)",
              border:"1px solid rgba(0,255,136,0.18)",
              textAlign:"center"
            }}>
              <div style={{ fontSize:28, marginBottom:6 }}>{reward.icon}</div>
              <div style={{ fontSize:12, color:"#e8fff5", marginBottom:4 }}>{reward.title}</div>
              <div style={{ fontSize:10, color:neon.yellow, marginBottom:10 }}>{reward.cost} pts</div>

              <button
                onClick={() => redeemReward(reward)}
                style={{
                  ...S.btn(points >= reward.cost ? neon.green : "#6b8f80", true),
                  padding:"7px 10px",
                  fontSize:9,
                  width:"100%"
                }}
              >
                {points >= reward.cost ? "Redeem" : "Locked"}
              </button>
            </div>
          ))}
        </div>
      </div>

      <div style={S.grid2}>
        <div style={S.card}>
          <div style={S.cardHead}>
            <span style={S.cardTitle}>🏆 Leaderboard</span>
          </div>

          <div style={S.cardBody}>
            {liveLeaderboard.map((l, i) => (
              <div key={i} style={{
                display:"flex",
                alignItems:"center",
                gap:12,
                padding:"10px 8px",
                borderBottom:"1px solid rgba(255,255,255,0.04)",
                background:l.isYou ? "rgba(0,255,136,0.08)" : "transparent",
                transform:l.isYou ? "scale(1.02)" : "scale(1)",
                transition:"all 0.35s ease",
                borderRadius:6
              }}>
                <span style={{ fontSize:16 }}>{l.badge}</span>

                <span style={{
                  flex:1,
                  fontSize:12,
                  color:l.isYou ? neon.green : "#e8fff5"
                }}>
                  #{l.rank} {l.name}
                </span>

                <span style={{ fontSize:11, color:neon.yellow, fontWeight:700 }}>
                  {l.pts} pts
                </span>
              </div>
            ))}
          </div>
        </div>

        <div style={S.card}>
          <div style={S.cardHead}>
            <span style={S.cardTitle}>🎖️ Badges</span>
            <span style={{ fontSize:9, color:"#6b8f80" }}>Click to claim</span>
          </div>

          <div style={{
            ...S.cardBody,
            display:"grid",
            gridTemplateColumns:"1fr 1fr",
            gap:10
          }}>
            {BADGES.map((b) => {
              const selected = selectedBadge === b.id;
              const claimed = claimedBadges.includes(b.id);

              return (
                <button
                  key={b.id}
                  onClick={() => claimBadge(b)}
                  style={{
                    padding:12,
                    textAlign:"center",
                    borderRadius:8,
                    background:b.earned ? "rgba(0,255,136,0.08)" : "rgba(255,255,255,0.02)",
                    border:selected ? `1px solid ${neon.yellow}` : `1px solid ${b.earned ? "rgba(0,255,136,0.25)" : "rgba(255,255,255,0.05)"}`,
                    opacity:b.earned ? 1 : 0.4,
                    cursor:"pointer",
                    transform:selected ? "translateY(-4px) scale(1.03)" : "translateY(0) scale(1)",
                    transition:"all 0.25s ease",
                    boxShadow:selected ? `0 0 18px ${neon.yellow}55` : "none",
                    fontFamily:"'Courier New',monospace"
                  }}
                >
                  <div style={{ fontSize:24, marginBottom:4 }}>{b.icon}</div>

                  <div style={{
                    fontSize:10,
                    color:b.earned ? neon.green : "#6b8f80",
                    marginBottom:4
                  }}>
                    {b.label}
                  </div>

                  <div style={{
                    fontSize:9,
                    color:claimed ? neon.cyan : neon.yellow
                  }}>
                    {claimed ? "CLAIMED" : b.earned ? `+${b.bonus} pts` : "LOCKED"}
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
};

  const TABS = [
    { id:"landing", label:"Home" },
    { id:"dashboard", label:"Dashboard" },
    { id:"throw", label:"Throw Waste" },
    { id:"classify", label:"AI Classify" },
    { id:"r_dashboard", label:"R Analytics" },
    { id:"map", label:"Bin Map" },
    { id:"chat", label:"EcoBot" },
    { id:"alerts", label:`Alerts (${alerts.length})` },
    { id:"rewards", label:"Rewards" },
  ];

  return (
    <div style={S.app}>
      <div style={S.grid} />

      {showAuth && fb && (
        <AuthModal onClose={()=>setShowAuth(false)} onAuth={(u)=>{ setUser(u); setShowAuth(false); }} fb={fb} />
      )}

      {toast && (
        <div style={{ position:"fixed", bottom:24, left:"50%", transform:"translateX(-50%)", zIndex:9999, background:"rgba(5,10,14,0.95)", border:`1px solid ${toast.type==="success"?neon.green:neon.red}`, borderRadius:8, padding:"10px 20px", fontSize:12, color:toast.type==="success"?neon.green:neon.red, boxShadow:`0 0 20px ${toast.type==="success"?neon.green:neon.red}44`, animation:"fadeIn 0.3s ease", whiteSpace:"nowrap" }}>
          {toast.msg}
        </div>
      )}

      <nav style={S.nav}>
        <div style={S.logo}>ECO<span style={{ color:neon.cyan }}>SMART</span></div>
        {TABS.map(t=>(
          <button key={t.id} style={S.tab(activeTab===t.id)} onClick={()=>setActiveTab(t.id)}>{t.label}</button>
        ))}
        <div style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:12, flexShrink:0 }}>
          <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:10, color:neon.green, whiteSpace:"nowrap" }}>
            <div style={S.pulse} /> {points} pts
          </div>
          <FBStatus user={user} onSignIn={()=>setShowAuth(true)} onSignOut={async()=>{ if(fb){ await fb.signOut(fb.auth); setUser(null); } }} fb={fb} />
        </div>
      </nav>

      <div style={S.main}>
  {activeTab==="landing" && <Landing />}
  {activeTab==="dashboard" && <Dashboard />}
  {activeTab==="throw" && <ThrowWaste />}
  {activeTab==="classify" && <AIClassifier />}
  {activeTab==="r_dashboard" && (
    <div style={S.card}>
      <div style={S.cardHead}>
        <span style={S.cardTitle}>📊 Statistical Analysis Dashboard (R Shiny)</span>
        <span style={{ fontSize: 10, color: neon.green }}>● Hosted on shinyapps.io</span>
      </div>
      <div style={{ ...S.cardBody, padding: 0, overflow: "hidden", borderRadius: "0 0 12px 12px" }}>
        <iframe
          src="https://jee2920.shinyapps.io/myshinyfinal/"
          width="100%"
          height="820px"
          style={{ border: "none", display: "block", background: "#050a0e" }}
          title="EcoSmart R Dashboard"
        />
      </div>
    </div>
  )}
  {activeTab==="map" && <MapTab />}
  {activeTab==="chat" && <Chatbot />}
  {activeTab==="alerts" && <Alerts />}
  {activeTab==="rewards" && <Rewards />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<EcoSmartApp />);

</script>
</body>
</html>
